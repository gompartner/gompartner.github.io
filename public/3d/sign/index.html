    araad.co.kr 채널간판 상품 목록 (전후광 캡 채널 165,000~285,000원, 일반 채널 120,000원, 후면발광 160,000원)
    https://araad.co.kr/category/%EC%B1%84%EB%84%90-%EA%B0%84%ED%8C%90/194/
  - 전체 비용대: 채널간판 평균 100~300만 원, 자재와 장비대 포함 여부로 차이 (시선공작소)
    https://incheonsign.com/protrusion-vs-channel-vs-standing/
  - 간판 제작 평균 견적 90만 원(최저 25만~최고 220만), LED 채널 사례 예산 250만 원 (숨고)
    https://soomgo.com/prices/%EA%B0%84%ED%8C%90-%EC%A0%9C%EC%9E%91
  - 고층 외벽 장비(스카이차)와 설치 범위 누락이 추가 비용의 주원인 (미소 후기 정리)
    https://miso.kr/blog/thread/%EA%B5%AC%EB%A1%9C%EA%B5%AC/%EA%B0%84%ED%8C%90-%EC%A0%9C%EC%9E%91-%ED%9B%84%EA%B8%B0
  - 옥외광고물 신고, 허가 기준(벽면이용간판): 면적 5제곱미터 이상 또는 4층 이상 표시 = 신고,
    한 변 10m 이상 또는 4층 이상 타사광고 = 허가 (수원시, 인천 연수구 안내 페이지)
    https://www.suwon.go.kr/sw-www/deptHome/dep_city/city08/city08_05/city08_05_01.jsp

  - 자당 단가, LED, SMPS, 설치비, 철거비는 위 범위에 맞춘 추정치. 업체별 공개 단가표는 찾지 못함.

<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:description" content="상호를 치면 글자가 가게 외벽에 붙고, 간판 종류와 글자 높이, 바탕, 설치 층을 고르면 채널 간판 견적이 바로 나옵니다.">

<style>
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 90deg; }
  :root {
    --bg: #dfe8ec;
    --surface: #ffffff;
    --ink: #1b2328;
    --ink-2: #434d53;
    --ink-3: #5d676d;
    --line: #d5dde1;
    --soft: #eef2f4;
    --accent: #1d5b74;
    --accent-ink: #ffffff;
    --over: #c25a0c;
    --over-soft: #fff1e3;
    --focus: #1f5fbf;
    --shadow: 0 1px 2px rgba(20,34,40,.10), 0 6px 18px rgba(20,34,40,.10);
    --top: env(safe-area-inset-top, 0px);
    --bot: env(safe-area-inset-bottom, 0px);
    --kb: 0px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 16px; line-height: 1.5; word-break: keep-all;
    -webkit-text-size-adjust: 100%;
    font-variant-ligatures: no-contextual; font-feature-settings: "calt" 0;
    transition: background-color .6s;
  }
  body.night { background: #0e1522; }
  button, input, select { font: inherit; color: inherit; font-feature-settings: "calt" 0; }
  button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { display: block; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  .nogl { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }

  /* 위: 상호, 메뉴, 견적 요청 */
  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    padding: calc(var(--top) + 10px) 16px 0; display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink); text-decoration: none; margin-right: auto; }
  .brand b { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .brand small { font-size: 12px; color: var(--ink-2); background: var(--surface); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  body.night .brand { color: #fff; }
  .ibtn {
    width: 44px; height: 44px; flex: none; display: inline-grid; place-items: center; padding: 0;
    background: var(--surface); border: 0; border-radius: 10px; color: var(--ink); box-shadow: var(--shadow);
  }
  .ibtn svg { width: 22px; height: 22px; }
  .cta {
    height: 44px; padding: 0 16px; border: 0; border-radius: 10px; font-weight: 700; font-size: 16px;
    background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); white-space: nowrap;
  }
  .cta:active { transform: translateY(1px); }

  .menu {
    position: fixed; z-index: 8; top: calc(var(--top) + 60px); right: 16px; width: 220px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 8px;
  }
  .menu a, .menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 12px; border: 0; background: none; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 16px; text-align: left; }
  .menu svg { width: 20px; height: 20px; color: var(--ink-2); }
  .menu a:hover, .menu button:hover { background: var(--soft); }
  .menu p { margin: 8px 12px 6px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }

  /* 치수와 금액 */
  .info {
    position: fixed; z-index: 4; left: 50%; top: calc(var(--top) + 64px); transform: translateX(-50%);
    display: flex; align-items: stretch; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums; max-width: calc(100vw - 32px);
  }
  .info button { border: 0; background: none; padding: 6px 14px; min-height: 52px; text-align: left; display: flex; align-items: center; gap: 8px; }
  .wbtn { border-radius: 12px 0 0 12px; min-width: 0; }
  .wbtn svg { width: 22px; height: 22px; flex: none; color: var(--ink-2); }
  .wbtn span { display: grid; line-height: 1.25; min-width: 0; }
  .wbtn b { font-size: 16px; white-space: nowrap; }
  .wbtn small { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .wbtn.over { background: repeating-linear-gradient(-45deg, var(--over-soft) 0 8px, #ffe2c4 8px 16px); }
  .wbtn.over small, .wbtn.over svg { color: var(--over); font-weight: 700; }
  .pbtn { border-left: 1px solid var(--line) !important; border-radius: 0 12px 12px 0; position: relative; }
  .pbtn b { font-size: 18px; white-space: nowrap; }
  .delta {
    position: absolute; right: 12px; top: 100%; margin-top: 6px; font-style: normal; font-size: 13px; font-weight: 700;
    background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
    visibility: hidden; transform: translateY(-4px); transition: transform .25s, visibility 0s .25s;
  }
  .delta.on { visibility: visible; transform: none; transition: transform .25s; }
  body.night .delta { background: #fff; color: var(--ink); }

  .fwpop {
    position: fixed; z-index: 6; left: 50%; top: calc(var(--top) + 124px); transform: translateX(-50%);
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; display: flex; align-items: center; gap: 6px;
  }
  .fwpop label { font-size: 14px; color: var(--ink-2); padding: 0 6px 0 4px; white-space: nowrap; }
  .fwpop input {
    width: 96px; height: 44px; border: 1px solid #c3cdd2; border-radius: 6px; text-align: center; font-size: 17px; font-weight: 700;
    font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .fwpop input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .fwpop .ibtn { box-shadow: none; background: var(--soft); }
  .fwpop em { font-style: normal; font-size: 14px; color: var(--ink-3); }

  /* 3D 위 글자 도구, 줄자 끌기 표시 */
  .act {
    position: fixed; z-index: 3; left: 0; top: 0; display: flex; gap: 6px; padding: 6px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); visibility: hidden;
  }
  .act button { width: 44px; height: 44px; border: 0; border-radius: 8px; background: var(--soft); display: grid; place-items: center; padding: 0; color: var(--ink); }
  .act button svg { width: 24px; height: 24px; }
  .act .del { color: #9b2c13; }
  .act::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px;
    background: var(--surface); transform: rotate(45deg); border-radius: 2px;
  }
  .grab {
    position: fixed; z-index: 3; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    background: var(--ink); color: #fff; display: grid; place-items: center; pointer-events: none; visibility: hidden;
    box-shadow: 0 0 0 3px #fff, var(--shadow);
  }
  .grab svg { width: 26px; height: 26px; }
  .grab.on { visibility: visible; animation: nudge 1s ease-in-out infinite alternate; }
  @keyframes nudge { from { translate: -6px 0; } to { translate: 6px 0; } }

  /* 상호 입력 */
  .dock {
    position: fixed; z-index: 4; left: 16px; right: 16px; bottom: calc(var(--bot) + 104px);
    display: flex; align-items: center; gap: 6px; padding: 6px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
  }
  .fontbtn {
    width: 48px; height: 48px; flex: none; border: 0; border-radius: 8px; background: var(--soft); padding: 0;
    font-size: 22px; line-height: 1; display: grid; place-items: center; color: var(--ink);
  }
  .dock input {
    flex: 1; min-width: 0; height: 48px; border: 0; border-radius: 8px; padding: 0 10px; background: transparent;
    font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: var(--ink);
  }
  .dock input:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
  .count { flex: none; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-right: 8px; white-space: nowrap; }
  .count.full { color: var(--over); font-weight: 700; }

  /* 아래: 트레이 */
  .tray {
    position: fixed; z-index: 4; left: 16px; right: 16px; bottom: calc(var(--bot) + 12px);
    display: flex; align-items: center; gap: 6px; padding: 8px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
  }
  .tile {
    flex: 1 1 0; min-width: 0; height: 68px; border: 0; border-radius: 10px; background: #f0f3f5;
    display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; padding: 6px 0 6px;
    user-select: none; -webkit-user-select: none; color: var(--ink);
  }
  .tile svg { width: 32px; height: 32px; }
  .tile span { font-size: 12px; font-weight: 600; line-height: 1.1; white-space: nowrap; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tile:active { background: #dfe6ea; }
  .tile[aria-expanded="true"] { background: var(--ink); color: #fff; }
  .tile[aria-pressed="true"] { background: #142033; color: #ffd27a; }
  .tdiv { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); flex: none; }
  .swbtn {
    width: 56px; height: 56px; flex: none; border-radius: 50%; border: 3px solid #fff; padding: 0;
    box-shadow: 0 0 0 1px #c3cdd2, 0 2px 6px rgba(0,0,0,.18);
  }
  .swbtn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--ink), 0 2px 6px rgba(0,0,0,.18); }

  /* 트레이에서 여는 선택 */
  .pop {
    position: fixed; z-index: 6; left: 0; bottom: 0; display: flex; gap: 6px; padding: 8px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); visibility: hidden;
    max-width: calc(100vw - 16px);
  }
  .pop.on { visibility: visible; }
  .pop .o {
    width: 64px; min-height: 76px; border: 0; border-radius: 10px; background: #f0f3f5; padding: 6px 2px;
    display: grid; grid-template-rows: auto auto auto; justify-items: center; align-content: center; gap: 2px; color: var(--ink);
  }
  .pop .o svg { width: 32px; height: 32px; }
  .pop .o span { font-size: 13px; font-weight: 600; line-height: 1.15; white-space: nowrap; }
  .pop .o small { font-size: 11px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pop .o small:empty { display: none; }
  .pop .o[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .pop .o[aria-pressed="true"] small { color: #d5dde1; }
  .pop .step { display: flex; align-items: center; gap: 6px; }
  .pop .step .ibtn { box-shadow: none; background: #f0f3f5; width: 52px; height: 52px; }
  .pop .step b { min-width: 104px; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .pop .step b small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); }
  .pop .step b small.over { color: var(--over); font-weight: 700; }
  .pop .law { position: absolute; left: 8px; right: 8px; bottom: 100%; margin: 0 0 6px; text-align: center; }
  .pop .law span { display: inline-block; background: var(--ink); color: #fff; font-size: 13px; padding: 4px 10px; border-radius: 6px; }
  .pop .law:empty { display: none; }

  /* 견본 부채 */
  .fan { position: fixed; z-index: 6; left: 0; top: 0; width: 0; height: 0; visibility: hidden; }
  .fan.on { visibility: visible; }
  .blade {
    position: absolute; left: 0; top: -23px; width: 200px; height: 46px; transform-origin: 0 50%;
    transform: rotate(calc(var(--a) * -1)); pointer-events: none;
    transition: --a .46s cubic-bezier(.3, 1.45, .55, 1);
  }
  .chipc {
    position: absolute; left: 106px; right: 0; top: 0; bottom: 0; border-radius: 23px; border: 3px solid #fff; padding: 0;
    pointer-events: auto; box-shadow: 0 2px 8px rgba(0,0,0,.22); transition: transform .2s;
  }
  .blade::before {
    content: ""; position: absolute; left: 22px; width: 90px; top: 18px; height: 10px; border-radius: 5px;
    background: var(--c, #ddd); box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.2);
  }
  .chipc[aria-pressed="true"] { transform: translateX(12px); box-shadow: 0 0 0 2px var(--ink), 0 2px 8px rgba(0,0,0,.22); }
  .fanhead {
    position: fixed; z-index: 6; right: 16px; bottom: 0; display: grid; justify-items: end; gap: 6px; visibility: hidden;
  }
  .fanhead.on { visibility: visible; }
  .fanhead p {
    margin: 0; background: var(--ink); color: #fff; font-size: 14px; padding: 4px 10px; border-radius: 6px; white-space: nowrap;
  }
  .fabs { display: flex; gap: 6px; background: var(--surface); padding: 5px; border-radius: 12px; box-shadow: var(--shadow); }
  .fabs button { height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: none; font-size: 15px; white-space: nowrap; }
  .fabs button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }

  .toast {
    position: fixed; z-index: 7; left: 50%; bottom: calc(var(--bot) + 176px); transform: translate(-50%, 8px);
    background: var(--ink); color: #fff; border-radius: 10px; padding: 0 6px 0 16px; min-height: 48px;
    display: flex; align-items: center; gap: 6px; font-size: 15px; max-width: calc(100vw - 32px);
    visibility: hidden; transition: transform .2s, visibility 0s .2s;
  }
  .toast.on { visibility: visible; transform: translate(-50%, 0); transition: transform .2s; }
  .toast span { padding: 12px 10px 12px 0; }
  .toast button { min-height: 44px; border: 0; background: none; color: #9fd8ef; font-weight: 700; padding: 0 10px; white-space: nowrap; }

  /* 견적 시트 */
  dialog.sheet {
    border: 0; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 90dvh;
    border-radius: 16px 16px 0 0; background: var(--surface); color: var(--ink); overflow: hidden;
  }
  dialog.sheet[open] { animation: sheet-up .32s cubic-bezier(.2,.9,.3,1); }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  dialog.sheet::backdrop { background: rgba(14,24,30,.34); }
  .sheet-in { max-height: 90dvh; overflow-y: auto; padding: 8px 16px calc(var(--bot) + 16px); }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -8px; background: var(--surface); padding: 6px 0; z-index: 1; }
  .sheet-h h2 { font-size: 19px; margin: 0; }
  .sheet-h .ibtn { box-shadow: none; }
  .sum { display: grid; gap: 2px; padding: 12px 14px; background: #f0f3f5; border-radius: 10px; }
  .sum b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .sum p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .sum .lawn { color: var(--accent); font-weight: 600; }
  .sum .lawn:empty { display: none; }
  details.parts, details.more { margin-top: 8px; }
  details summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-size: 15px; color: var(--ink-2); list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: ""; width: 8px; height: 8px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg); margin: -4px 0 0 10px; }
  details[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; padding-left: 12px; }
  td small { display: block; color: var(--ink-3); font-size: 13px; }
  tr.sub td { color: var(--ink-2); }
  .check { display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; font-size: 15px; }
  .check input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); flex: none; }
  .check em { font-style: normal; color: var(--ink-3); font-size: 14px; font-variant-numeric: tabular-nums; }
  form .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  form .in { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); margin-top: 12px; min-width: 0; align-content: start; }
  form input {
    height: 48px; border: 1px solid #b6c2c8; border-radius: 6px; padding: 0 12px; font-size: 17px; color: var(--ink); background: #fff; width: 100%; min-width: 0;
  }
  form input[type="date"] { -webkit-appearance: none; appearance: none; display: block; line-height: 46px; text-align: left; font-size: 16px; padding: 0 8px; }
  form input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  form [aria-invalid="true"] { border-color: #b3261e; border-width: 2px; }

function rdp(pts, eps) {

  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];

}

    }
    if (pts.length < 6) continue;
    const sp = simplifyClosed(pts, 0.35);
    if (sp.length < 3) continue;

    if (Math.abs(ar) < 6) continue;

  if (!loops.length) { glyphCache.set(key, res); return res; }
  const big = loops.reduce((m2, l) => Math.abs(l.ar) > Math.abs(m2.ar) ? l : m2);
  const sign = Math.sign(big.ar);
  const outers = loops.filter(l => Math.sign(l.ar) === sign).map(l => ({ ...l, holes: [] }));
  for (const l of loops) {
    if (Math.sign(l.ar) === sign) continue;
    let best = null;
    for (const o of outers) if (Math.abs(o.ar) > Math.abs(l.ar) && inside(l.pts[0], o.pts) && (!best || Math.abs(o.ar) < Math.abs(best.ar))) best = o;
    if (best) best.holes.push(l.pts);

  for (const o of outers) for (const [x, y] of o.pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  res.shapes = outers.map(o => ({ outer: o.pts, holes: o.holes }));
  res.box = { x0, x1, y0, y1 };
  glyphCache.set(key, res);

}

// 글자 배치 (2D 계산만, 3D와 견적이 함께 씁니다)
let lay = null;
let layToken = 0;
async function layout() {
  const token = ++layToken;
  const f = fontOf(), text = state.text.trim();
  const hasHangul = /[가-힣ㄱ-ㅣ]/.test(text);
  try { await document.fonts.load(fontCss(f, FS), (text || '한') + '한H'); } catch (e) { /* 기본 글꼴로 그립니다 */ }
  if (token !== layToken) return null;
  const ref = traceGlyph(hasHangul || !text ? '한' : 'H', f);
  const refH = ref.box ? ref.box.y1 - ref.box.y0 : FS * 0.8;
  const s = state.h / 1000 / refH;
  const glyphs = [];

  for (const ch of [...text]) {

}

// 합계: 숫자가 짧게 굴러가며 바뀌고, 변동액이 잠깐 보입니다
let totTarget = null, totShown = 0, totRaf = 0;
function setTotal(v) {

  if (v === totTarget) return;
  const d = v - totTarget;

    night += (nightT - night) * (reduce ? 1 : 1 - Math.exp(-dt * 4));
    if (Math.abs(nightT - night) < 0.001) night = nightT;
    const n = night;
    scene.background.copy(DAY_BG).lerp(NIGHT_BG, n);
    hemi.intensity = 0.6 - 0.48 * n;
    sun.intensity = 3.0 - 2.75 * n;
    sun.color.copy(sunDay).lerp(sunNight, n);
    const env = 1 - 0.85 * n;
    for (const m of envMats) m.envMapIntensity = env;
    interiorMat.emissiveIntensity = 0.1 + 0.5 * n;
    roomMat.emissiveIntensity = 0.6 * n;
    winMat.emissiveIntensity = 0.55 * n; winMat2.emissiveIntensity = 0.12 * n;
    shopLight.intensity = 9 * n;
    pool.material.opacity = 0.18 * n;
    pool.scale.set(builtW + 1, 3, 1);
    const tp = typeOf();

    // 글자
    let litSum = 0;
    letters.forEach((L, i) => {
      const o = L.grp;
      if (L.rebuild && now >= L.rebuild) { L.rebuild = 0; fillLetter(L, L.rebuildGl, curLay); if (!reduce) L.sqv -= 3.2; }
      if (L.drop) {
        if (now < L.drop.t0) { o.visible = false; return; }
        if (!L.drop.go) { L.drop.go = true; L.pos.set(L.tgt.x, L.tgt.y + 0.9, L.tgt.z + 1.5); L.vel.set(0, 0, -1.5); }
        o.visible = true;
        L.vel.z -= 34 * dt; L.pos.z += L.vel.z * dt;
        const f = Math.max(0, (L.pos.z - L.tgt.z) / 1.5);
        L.pos.x = L.tgt.x; L.pos.y = L.tgt.y + f * f * 0.9;
        if (L.pos.z <= L.tgt.z) {
          L.pos.copy(L.tgt); L.vel.set(0, 0, 0); L.drop = null; L.sqv -= 6.5;
          if (nightT) L.lightT0 = now + 0.08;
        }
      } else if (reduce) {
        L.pos.copy(L.tgt);
      } else {
        v3.copy(L.tgt).sub(L.pos);
        L.vel.addScaledVector(v3, 260 * dt).multiplyScalar(Math.exp(-dt * 18));
        L.pos.addScaledVector(L.vel, dt);
      }
      // 벽에 붙을 때 눌렸다 돌아옵니다
      if (!reduce) { L.sqv += (-520 * L.sq - 14 * L.sqv) * dt; L.sq += L.sqv * dt; L.sq = Math.max(-0.5, Math.min(0.3, L.sq)); } else L.sq = 0;
      const sel = L === selL ? 0.16 : 0;
      o.position.set(L.pos.x, L.pos.y, L.pos.z + sel);
      o.scale.set(1 - L.sq * 0.12, 1 - L.sq * 0.12, Math.max(0.2, 1 + L.sq));
      // 색 번짐
      if (L.col && now >= L.col.t0) {
        const t = Math.min(1, (now - L.col.t0) / 0.3), e = t * t * (3 - 2 * t);
        L.faceM.color.copy(L.col.f).lerp(T.face, e); L.sideM.color.copy(L.col.s).lerp(T.side, e);
        L.glow.copy(L.col.g).lerp(T.glow, e); L.emit.copy(L.col.e).lerp(T.emit, e);
        if (t >= 1) L.col = null;
      }
      // 불
      let lt = 0;
      if (nightT && !L.drop) { const tt = now - L.lightT0; lt = tt < 0 ? 0 : reduce ? 1 : flick(tt); }
      const lg = lt * n;
      L.lit += (lg - L.lit) * (nightT || reduce ? 1 : 1 - Math.exp(-dt * 6));
      const li = L.lit;
      litSum += li;
      L.faceM.emissive.copy(L.emit).multiplyScalar(emitK * li);
      L.sideM.emissive.copy(L.glow).multiplyScalar(tp.front ? 0.32 * li : 0);
      L.wallG.material.opacity = li * wallGlowK; L.frontG.material.opacity = li * frontGlowK;
      L.wallG.material.color.copy(L.glow); L.frontG.material.color.copy(L.glow);
      L.wallG.visible = li > 0.002; L.frontG.visible = li > 0.002 && frontGlowK > 0;
    });
    signLight.position.set(0, signRoot.position.y - 0.2, 0.9);
    signLight.color.copy(T.glow);
    signLight.intensity = (letters.length ? litSum / letters.length : 0) * (tp.front ? 2.5 : 3.5);
    // 빠지는 글자: 벽에서 떨어져 앞으로 떨어집니다
    for (let i = dying.length - 1; i >= 0; i--) {
      const L = dying[i];
      L.vel.y -= 14 * dt; L.pos.addScaledVector(L.vel, dt);
      L.grp.position.copy(L.pos); L.grp.rotation.x += 3 * dt; L.grp.rotation.z += L.spin * dt;
      L.grp.scale.multiplyScalar(1 - dt * 1.2);
      if (reduce || L.pos.y < -signRoot.position.y - 0.5 || L.grp.scale.x < 0.2) {
        signRoot.remove(L.grp); L.mesh.geometry.dispose(); L.faceM.dispose(); L.sideM.dispose(); L.wallG.material.dispose(); L.frontG.material.dispose();
        dying.splice(i, 1);
      }
    }
    // 바탕: 위에서 내려와 붙고, 바뀌면 위로 빠집니다
    if (baseCur) {
      const u = baseCur.userData;
      if (reduce) u.y = 0;
      else { u.vy += (-u.y * 200 - u.vy * 16) * dt; u.y += u.vy * dt; }
      baseCur.position.y = u.y;
    }
    for (let i = baseDying.length - 1; i >= 0; i--) {
      const b = baseDying[i], u = b.userData;
      u.vy += 12 * dt; u.y += u.vy * dt; b.position.y = u.y; b.position.z += dt * 1.5;
      if (reduce || u.y > 6) { b.traverse(o => { if (o.isMesh) o.geometry.dispose(); }); signRoot.remove(b); baseDying.splice(i, 1); }
    }

    // 카메라 초점: 판 전체 (높은 층이면 간판 자리 주변)
    const hw = (builtW + PW * 2) / 2;
    // 줄자를 끄는 동안에는 화면을 고정해 손가락 아래 자리가 흔들리지 않게 합니다
    if (!fwDrag) {
      const yb = bandY - 6 < 1.5 ? -SLAB_T : bandY - 3.8;
      goal.min.set(Math.min(-hw - 0.2, gnd.x - gnd.w / 2 + 0.6), yb, -BLD_D);
      goal.max.set(Math.max(hw + 0.2, gnd.x + gnd.w / 2 - 0.6), Math.min(topY, bandY + BAND_H / 2 + 1.5), yb < 0 ? gnd.d - 0.3 : 1.4);
    }
    if (!fr.init) { focus.min.copy(goal.min); focus.max.copy(goal.max); }
    if (introCam) {
      const f = 1 - Math.exp(-dt * 1.6);
      v3.copy(camera.position).sub(controls.target).normalize().lerp(goalDir, f).normalize();
      camera.position.copy(controls.target).addScaledVector(v3, DIST);
      if (v3.distanceTo(goalDir) < 0.002) introCam = false;
    }
    const fk = reduce ? 1 : 1 - Math.exp(-dt * 4.2);
    focus.min.lerp(goal.min, fk); focus.max.lerp(goal.max, fk);
    _p.copy(focus.min).add(focus.max).multiplyScalar(0.5);
    v3.copy(_p).sub(controls.target);
    controls.target.add(v3); camera.position.add(v3);
    controls.update();
    camera.updateMatrixWorld();
    const cw = innerWidth, ch = innerHeight, aspect = cw / ch;
    let i = 0;
    for (const x of [focus.min.x, focus.max.x]) for (const y of [focus.min.y, focus.max.y]) for (const z of [focus.min.z, focus.max.z]) corners[i++].set(x, y, z).applyMatrix4(camera.matrixWorldInverse);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const c of corners) { x0 = Math.min(x0, c.x); x1 = Math.max(x1, c.x); y0 = Math.min(y0, c.y); y1 = Math.max(y1, c.y); }
    const W = wide();
    const dockTop = shotMode ? ch - 34 : $('dock').getBoundingClientRect().top;
    const mt = shotMode ? 40 : W ? 96 : 128, mb = Math.max(34, ch - dockTop + 6), ms = shotMode ? 50 : W ? 60 : -26;
    const S = Math.max((y1 - y0) * ch / (2 * (ch - mt - mb)), (x1 - x0) * ch / (2 * (cw - 2 * ms)));
    const yc = mt + (ch - mt - mb) / 2, ny = 1 - 2 * yc / ch;
    const cy = (y0 + y1) / 2 - ny * S, cx = (x0 + x1) / 2;
    if (!fr.init || reduce) { fr.S = S; fr.cx = cx; fr.cy = cy; fr.init = true; }
    else { fr.S += (S - fr.S) * fk; fr.cx += (cx - fr.cx) * fk; fr.cy += (cy - fr.cy) * fk; }
    camera.left = fr.cx - fr.S * aspect; camera.right = fr.cx + fr.S * aspect;
    camera.top = fr.cy + fr.S; camera.bottom = fr.cy - fr.S;
    camera.updateProjectionMatrix();
    sun.target.position.set(0, bandY - 2, 0); sun.position.copy(sun.target.position).add(SUN_OFF);

    // 고른 글자 위 도구
    const show = !!selL && !selL.dying && actEl.childElementCount > 0;
    if (show) {
      _p.copy(selL.ctr).add(selL.pos).add(signRoot.position); _p.y += state.h / 1000 * 0.55; _p.project(camera);
      const x = (_p.x + 1) / 2 * cw, y = (1 - _p.y) / 2 * ch;
      const aw = actEl.offsetWidth, ah = actEl.offsetHeight;
      const lx = Math.max(8, Math.min(cw - aw - 8, x - aw / 2)), ly = Math.max(W ? 90 : 128, y - ah - 12);
      actEl.style.transform = `translate(${Math.round(lx)}px, ${Math.round(ly)}px)`;
    }
    if (show !== actShown) { actShown = show; actEl.style.visibility = show ? 'visible' : 'hidden'; }
    // 줄자 끌기 안내
    const gOn = grabUntil && now < grabUntil && now > introEnd - 0.4;
    if (gOn) {
      _p.copy(tapeCase.position).add(signRoot.position).project(camera);
      grabEl.style.transform = `translate(${Math.round((_p.x + 1) / 2 * cw)}px, ${Math.round((1 - _p.y) / 2 * ch - 44)}px)`;
    } else if (grabUntil && now >= grabUntil) hideGrab();
    grabEl.classList.toggle('on', !!gOn);

    renderer.render(scene, camera);
  });

  window.__sign = {
    ready: () => performance.now() / 1000 > introEnd && !introCam && !letters.some(L => L.drop || L.rebuild || L.col) && !dying.length && Math.abs(night - nightT) < 0.01,
    setNight: v => { setNight(v); night = nightT; },
    view: () => ({ az: Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z), zoom: camera.zoom }),
    state: () => ({ ...state, letters: letters.length, total: computeQuote().total }),
    dragging: () => !!fwDrag,
    casePos: () => { _p.copy(tapeCase.position).add(signRoot.position).project(camera); return { x: (_p.x + 1) / 2 * innerWidth, y: (1 - _p.y) / 2 * innerHeight }; },
    letterPos: i => { const L = letters[i]; if (!L) return null; _p.copy(L.ctr).add(L.pos).add(signRoot.position); _p.z += 0.05; _p.project(camera); return { x: (_p.x + 1) / 2 * innerWidth, y: (1 - _p.y) / 2 * innerHeight }; },
    hideUI: v => {
      shotMode = !!v;
      document.querySelectorAll('.top, .info, .dock, .tray, .grab').forEach(e => { e.style.visibility = v ? 'hidden' : ''; });
    }
  };
  return { build, setNight, select };
}
</script>
