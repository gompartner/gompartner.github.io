<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!--
  3D 인테리어 상담 화면 1차 (11-26)
  인테리어, 붙박이 가구, 리모델링 업체 홈페이지에 넣는 화면. 손님이 평형 타입의 거실에 굵직한 품목을 실제 치수로 넣어 보고
  그 구성과 예상 금액 그대로 상담을 신청한다.

  화면 배치는 세 가지를 견주어 2번으로 정했다.
  1) 옆 패널에 품목별 접이식 목록: PC는 좋지만 휴대폰에서는 목록이 길어져 3D를 가리고 엄지가 위아래로 오간다.
  2) 아래 패널에 품목 탭(채택): 탭 한 줄, 그 품목의 선택지, 합계와 신청 버튼이 화면 아래 절반에 모여 한 손 엄지로 닿는다.
     고른 탭이 곧 치수를 보여 줄 품목이라 3D와 패널이 같이 움직인다. PC에서는 같은 구조를 오른쪽 패널로 세우고 견적 내역을 늘 펼친다.
  3) 단계별 진행: 순서를 강제해 품목을 오가며 합계가 바뀌는 것을 보기 어렵고 누르는 횟수가 늘어난다.

  단가는 스크립트 맨 위 PRICE 한 곳에 있다. 납품 때 업체 단가표로 바꾼다.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<script>
  // 11-26 사용자 "3D에서 두 번 터치 확대 안 되도록", "이 상태면 조정이 안 됨": 아이패드 사파리가 버튼을 빠르게 두 번 누르면 페이지를 키운다.
  // 두 번째 탭의 기본 동작(확대)만 막고 누른 버튼은 그대로 눌리게 한다. PINCH가 참이면 두 손가락 페이지 확대도 막는다(3D 안 확대는 그대로).
  (function () {
    var PINCH = true;
    // 11-27 사용자 "가로채기 필요, 먹통이 아니라 확대돼서 안 줄어듦": 두 번째 탭 가로채기는 되살리고(3D 위도 포함) 확대된 채로 갇히지 않게 한다
    //  1) 두 번째 탭은 기본 동작(확대)을 막고 누른 버튼은 대신 누른다
    //  2) 그래도 확대되면(다른 손짓 등) 한 손가락을 뗄 때 배율을 1로 되돌린다(viewport에 maximum-scale을 잠깐 넣었다 뺀다)
    //  3) 확대된 동안에는 두 손가락 축소를 막지 않는다
    var last = 0, meta = document.querySelector('meta[name="viewport"]');
    var zoomed = function () { return window.visualViewport && visualViewport.scale > 1.01; };
    var unzoom = function () {
      if (!meta || !zoomed()) return;
      var c = meta.getAttribute('content');
      meta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1');
      setTimeout(function () { meta.setAttribute('content', c); }, 400);
    };
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - last < 350 && e.changedTouches.length === 1 && !e.target.closest('input, select, textarea')) {
        e.preventDefault();
        var b = e.target.closest('button, a, label, [role="tab"], [role="switch"]');
        if (b) b.click();
      }
      last = now;
      if (e.touches.length === 0) setTimeout(unzoom, 60);
    }, { passive: false });
    if (PINCH) ['gesturestart', 'gesturechange'].forEach(function (t) { document.addEventListener(t, function (e) { if (!zoomed()) e.preventDefault(); }, { passive: false }); });
  })();
</script>

<style>
  :root {
    --bg: #0b0d12;
    --panel: #121722;
    --panel-2: #1a2130;
    --panel-3: #232c3f;
    --ink: #ffffff;
    --ink-2: #c9d0de;
    --ink-3: #97a1b5;
    --line: rgba(255, 255, 255, 0.10);
    --line-2: rgba(255, 255, 255, 0.22);
    --blue: #256ef4;
    --sky: #7aa7ff;
    --yellow: #ffd84d;
    --top: env(safe-area-inset-top, 0px);
    --bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  html { touch-action: manipulation; }   /* 11-26 사용자 "두 번 터치 확대 안 되도록" */
  /* 11-26 아이폰 화면 녹화: 소파를 끄는 중 길게 누르기로 읽혀 3D 화면이 파랗게 선택되고 '복사하기, 찾아보기' 메뉴가 떴다. 3D 무대와 버튼은 선택, 길게 누르기 메뉴, 누름 반짝임을 끈다 */
  .stage, .stage *, .tabs, .chips, .bar, .top { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body {
    color: var(--ink);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 16px; line-height: 1.5; word-break: keep-all;
    -webkit-text-size-adjust: 100%;
    font-variant-ligatures: no-contextual; font-feature-settings: "calt" 0;
  }
  button { font: inherit; color: inherit; font-feature-settings: "calt" 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  h1, h2, h3, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  :focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }

  .app {
    height: 100vh; height: 100dvh; display: grid; min-width: 0;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top" "stage" "panel";
  }

  /* 위: 상호와 화면 이름 */
  .top {
    grid-area: top; display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: calc(var(--top) + 6px) 16px 6px; min-height: 48px; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; text-decoration: none; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; }
  .top h1 { font-size: 15px; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 10px; border-left: 1px solid var(--line-2); line-height: 1.2; }
  .top .for { margin-left: auto; font-size: 14px; color: var(--ink-3); white-space: nowrap; display: none; }
  .embed .top { display: none; }

  /* 3D 영역 */
  .stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 62%, #151c2c 0%, #0b0d12 62%); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; transition: opacity .16s linear; }
  #gl:active { cursor: grabbing; }
  #gl.fade { opacity: 0; }
  #labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .dim, .tag {
    position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform;
    font-size: 12px; font-weight: 700; line-height: 1; padding: 4px 6px; border-radius: 4px; font-variant-numeric: tabular-nums;
  }
  .dim.room { background: rgba(11, 13, 18, 0.82); color: var(--sky); border: 1px solid rgba(122, 167, 255, 0.55); }
  .dim.sel { background: var(--yellow); color: #14161c; }
  .tag { background: rgba(11, 13, 18, 0.78); color: #fff; font-weight: 600; border: 1px solid var(--line-2); }

  .type {
    position: absolute; left: 12px; top: 12px; display: grid; gap: 1px; padding: 8px 12px;
    background: rgba(18, 23, 34, 0.86); border: 1px solid var(--line); border-radius: 10px; pointer-events: none;
  }
  .type span { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
  .type b { font-size: 16px; line-height: 1.3; }
  .type small { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
  /* 11-26 사용자 "거실을 크게 확장하거나 줄이거나, 평형을 고정하지 말고": 폭과 깊이를 300 mm씩 늘리고 줄인다 */
  .rs { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .rs em { font-style: normal; font-size: 13px; color: var(--ink-3); width: 28px; }
  .rs b { min-width: 50px; text-align: center; font-size: 15px; }
  .rs button { pointer-events: auto; width: 36px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.06); color: #fff; font: inherit; font-size: 18px; line-height: 1; cursor: pointer; }
  .rs button:hover { background: rgba(255, 255, 255, 0.14); }
  .rs button:disabled { opacity: 0.35; cursor: not-allowed; }
  .type small { margin-top: 4px; }
  .rs-sum { display: none; pointer-events: auto; align-items: center; gap: 6px; border: 0; background: none; color: #fff; font: inherit; padding: 2px 0; cursor: pointer; }
  .rs-sum b { font-size: 14px; }
  .rs-sum svg { width: 16px; height: 16px; transition: transform .2s; }
  .open > .rs-sum svg { transform: rotate(180deg); }
  @media (max-width: 699px), (max-height: 500px) {   /* 11-26 사용자 "아직도 공간 개선이 필요"(눕힌 휴대폰도): 휴대폰은 거실 크기를 한 줄로 접어 두고 누르면 편다 */
    .rs-sum { display: flex; }
    #roomsize { padding: 6px 10px; }
    #roomsize:not(.open) > :not(.rs-sum) { display: none; }
  }
  .est { margin: 2px 0 0; font-size: 14px; font-weight: 700; color: var(--yellow); line-height: 1.3; }
  /* 3D 위에서 벽을 끌어 크기를 바꾸는 손잡이. 위치와 화살표 방향은 프레임마다 카메라에 맞춘다 */
  .hdl { position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 2px solid #fff; background: var(--blue); color: #fff; display: grid; place-items: center; cursor: grab; touch-action: none; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45); z-index: 3; }
  .hdl svg { width: 22px; height: 22px; }
  .hdl.drag { cursor: grabbing; background: var(--yellow); color: #14161c; }
  .hdl[hidden] { display: none; }
  .stage.moving #labels, .stage.moving .hdl { visibility: hidden; }
  .hdl.item { background: #fff; color: #14161c; border-color: var(--blue); }   /* 가구 손잡이: 고른 품목에만 흰 손잡이 */

  .tools { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; align-items: center; }
  /* 11-26 사용자 "메뉴는 접었다 펼 수 있게": 접으면 선택지와 견적 내역을 감추고 3D를 넓게. 휴대폰은 품목 이름과 합계 한 줄만, 넓은 화면은 오른쪽 패널을 통째로 */
  .tog.lnk { padding: 0; width: 44px; justify-content: center; }
  .tog.lnk svg { width: 18px; height: 18px; }
  /* 11-26 사용자 "메뉴 접기만 원래 위치로, 모바일에서 위에 있으니 불편": 3D 아래 버튼 줄(엄지 닿는 곳)로 되돌림 */
  .tog.fold { gap: 4px; }
  .tog.fold svg { width: 16px; height: 16px; transition: transform .2s; }
  .tog.fold[aria-expanded="false"] svg { transform: rotate(180deg); }
  .app.fold .opts, .app.fold .bill { display: none !important; }
  @media (min-width: 700px) { .stage .hint { max-width: calc(100% - 330px); } }   /* 넓은 화면: 안내가 오른쪽 아래 버튼들과 겹치지 않게 */
  @media (max-width: 699px) { .stage .hint { top: 52px; bottom: auto; right: 8px; left: 8px; text-align: center; } }   /* 좁은 화면에서는 안내를 위쪽(거실 크기 줄 아래)에 두어 아래 버튼과 겹치지 않게 */
  .seg { display: flex; background: rgba(18, 23, 34, 0.92); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button, .tog, .zoom button {
    min-height: 40px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 15px; font-weight: 600; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .tog { background: rgba(18, 23, 34, 0.92); border: 1px solid var(--line); border-radius: 10px; min-height: 46px; display: inline-flex; align-items: center; gap: 6px; }
  .tog i { width: 8px; height: 8px; border-radius: 50%; background: #56607a; }
  .tog[aria-pressed="true"] { color: #fff; }
  .tog[aria-pressed="true"] i { background: var(--yellow); }
  .zoom { position: absolute; right: 12px; top: 12px; display: none; flex-direction: column; background: rgba(18, 23, 34, 0.92); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .zoom button { font-size: 20px; line-height: 1; padding: 0; }
  .zoom button:hover, .seg button:hover, .tog:hover { color: #fff; }
  .hint { position: absolute; left: 12px; bottom: 12px; font-size: 13px; color: var(--ink-2); background: rgba(18, 23, 34, 0.86); border-radius: 8px; padding: 6px 10px; pointer-events: none; transition: opacity .4s; max-width: calc(100% - 200px); }
  .hint.off { opacity: 0; }
  .nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }

  /* 패널: 품목 탭, 선택지, 견적 */
  .panel {
    grid-area: panel; position: relative; min-width: 0; background: var(--panel); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "tabs" "opts" "bar";
  }
  .tabs { grid-area: tabs; display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }   /* 11-26 소파가 들어와 품목이 여섯이 되어 한 줄로 두고 넘치면 옆으로 민다 */
  .tabs::-webkit-scrollbar { display: none; }
  /* 11-26 사용자 "드래그됨": 품목이 일곱이 되어 넓은 화면 패널에서도 탭 줄이 옆으로 밀렸다. 넓은 화면은 한 줄에 다 들어가게 줄이고, 휴대폰만 밀어서 본다 */
  @media (min-width: 700px) { .tabs { overflow-x: hidden; } .tabs button { padding: 0 4px !important; font-size: 14px !important; gap: 4px !important; } }
  @media (max-width: 699px) { .tabs button { padding: 0 2px !important; font-size: 13.5px !important; gap: 3px !important; } .tabs button i { width: 6px; height: 6px; } }
  .tabs button {
    position: relative; flex: 1 0 auto; min-height: 48px; padding: 0 9px; border: 0; background: none; color: var(--ink-3);
    font-size: 15px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .tabs button i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid #5d6780; flex: none; }
  .tabs button.on i { background: var(--sky); border-color: var(--sky); }
  .tabs button[aria-selected="true"] { color: #fff; }
  .tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--blue); }

  .opts { grid-area: opts; height: clamp(176px, 27dvh, 236px); overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px 14px; }
  .ihead { display: flex; align-items: center; gap: 12px; }
  .ihead > div { min-width: 0; margin-right: auto; }
  .ihead h2 { font-size: 17px; font-weight: 700; line-height: 1.3; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ihead h2 b { font-size: 15px; font-weight: 600; color: var(--sky); font-variant-numeric: tabular-nums; }
  .ihead p { font-size: 14px; color: var(--ink-3); line-height: 1.4; }
  .sw {
    flex: none; position: relative; width: 56px; height: 32px; margin: 6px 0; border-radius: 16px; border: 0; padding: 0; background: #3a445a; transition: background .15s;
  }
  .sw::before { content: ""; position: absolute; inset: -6px -2px; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw[aria-checked="true"] { background: var(--blue); }

  .chip[aria-pressed="true"] { border-color: var(--sky); background: rgba(37, 110, 244, 0.24); color: #fff; box-shadow: inset 0 0 0 1px var(--sky); }

  /* 휴대폰: 견적 내역은 합계를 누르면 버튼 위로 펼친다 */

<script type="module">
/* =====================================================================
   업체 단가표 (납품 때 이 묶음만 업체 자료로 바꿉니다. 단위: 원, 부가세 별도)
   ===================================================================== */
const PRICE = {
  tvUnit: {                       // 거실장: 폭별 제작 금액, 색상 추가금
    width: { 1800: 450000, 2400: 590000, 3000: 740000 },

    mod: { S: 470000, L: 780000 },                // 1인 모듈, 카우치 모듈

    frame: rows => 39000 + rows * 10000,          // 사이드 프레임 1조(칸 수 + 1조)

    acc: { e: 0, d: 98000, o: 129000 },           // 아래 칸 부속(칸마다): 빈칸, 서랍 2단, 양문 도어

/* 거실 크기 (처음은 34평 판상형 거실 치수. 손님이 폭과 깊이를 300 mm씩 늘리고 줄인다. 단위 m) */
// 11-26 사용자 "45평 제한을 두지 말고, 24, 34, 45 평형 버튼은 필요 없음(집마다 구조가 다름)": 큰 쪽 제한을 넓히고 길이에 따라 예상 평형만 보여 준다
// 11-26 사용자 "최대 제약 있어야겠네": 큰 쪽은 아파트 거실로 있을 만한 크기까지(폭 7.2 m, 깊이 6.0 m, 예상 약 78평)
const ROOM = { name: '거실', W: 4.5, D: 4.2, H: 2.3, T: 0.12, min: { W: 3.0, D: 3.0 }, max: { W: 7.2, D: 6.0 }, step: 0.3 };
// 예상 평형: 판상형 아파트 거실 넓이(㎡)에 1.8을 곱한 값. 59㎡(24평형) 거실 약 14㎡, 84㎡(34평형) 약 19㎡, 114㎡(45평형) 약 26㎡ 사례를 맞춘 어림값이라 '약'으로만 쓴다
const estPy = () => Math.round(W * D * 1.8);

/* 품목과 선택지 */

      tryMove(id === 'tv' ? 'tvUnit' : id, it.get, (x, z) => it.set(x, z), grab.x + tableDrag.dx, grab.z + tableDrag.dz);
      if (id === 'tv' || id === 'tvUnit') placeAxis(cxOf(state));
      slots.sofa.position.set(sofaX(state) - bs.sx, 0, sofaBack(state) - bs.sz);   // 소파는 TV 축을 따라가기도 해서 늘 맞춘다
      slots.closet.position.z = closetZ1(state) - bs.cz;
      shadowDirty = true; invalidate();

    }
    const m = tableDrag.m; moving(true); m.moved = true;
    if (m.g === tableG) tryMove('table', () => [tableG.position.x, tableG.position.z], (x, z) => { tableG.position.x = x; tableG.position.z = z; placeTable(); }, grab.x + tableDrag.dx, grab.z + tableDrag.dz);
    else { m.g.position.x = grab.x + tableDrag.dx; m.g.position.z = grab.z + tableDrag.dz; placeTable(); }   // 러그는 가구 밑에 깔려 겹쳐도 된다
    invalidate();
  });
  const tableEnd = e => { if (!tableDrag) return; const t = tableDrag; tableDrag = null; saveLink();
    if (t.item && !t.moved && t.item !== ui.tab) selectTab(t.item, false, false);   // 끌지 않고 누르기만 했으면 그 품목을 고른다
    if (t.item && t.moved) {   // 놓은 자리에서 한 번만 다시 만든다(밀어 둔 묶음 자리는 되돌리고, 튕김 연출 없이)
      slots.sofa.position.set(0, 0, 0); slots.closet.position.set(0, 0, 0);
      fitWhy = fitAll(state);
      for (const k of ['tvUnit', 'sofa', 'closet']) rebuild(k, false);
      if (state.shelf.on) rebuild('shelf', false);

    }
    itemDrag = false; moving(false); canvas.style.cursor = ''; controls.enabled = ui.view === '3d'; try { stage.releasePointerCapture(e.pointerId); } catch (_) {} };
  stage.addEventListener('pointerup', tableEnd); stage.addEventListener('pointercancel', tableEnd);

  // 가구를 누르면 그 품목을 고른다(끌어서 돌린 것은 누른 것으로 보지 않는다)
  let tapAt = null;
  canvas.addEventListener('pointerdown', e => { tapAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', e => {
    if (!tapAt || Math.hypot(e.clientX - tapAt.x, e.clientY - tapAt.y) > 8 || performance.now() - tapAt.t > 400) { tapAt = null; return; }
    tapAt = null;
    const r = stage.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, cam);
    const hits = ray.intersectObjects(ITEMS.map(it => slots[it.id]).filter(g => g.visible), true).filter(x => x.object.material !== M.ghost);
    if (!hits.length) return;
    let o = hits[0].object; while (o && !Object.values(slots).includes(o)) o = o.parent;
    const id = o && Object.keys(slots).find(k => slots[k] === o);
    if (id && id !== ui.tab) selectTab(id, false, false);
  });

  /* ----- 그리기: 바뀔 때만 ----- */
  let raf = 0, shadowDirty = true, lastT = 0, acc = 0, cnt = 0, lastShadow = 0;
  window.__fps = 0;
  function invalidate() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    let again = runTweens(now);
    if (ui.view === '3d') { if (controls.update()) again = true; wallsFor(persp.position); }
    else { for (const w of Object.values(WALL)) showWall(w, true); slots.closet.visible = true; }
    if (shadowDirty && (!itemDrag && !tableDrag || now - lastShadow > 100)) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; lastShadow = now; }
    else if (shadowDirty) again = true;   // 끄는 동안 건너뛴 그림자는 다음 장면에서
    renderer.render(scene, cam);
    placeLabels(); placeHandles();
    const dt = now - lastT; lastT = now;
    if (dt > 0 && dt < 120) { acc += dt; cnt++; if (acc >= 500) { window.__fps = Math.round(cnt * 1000 / acc); acc = 0; cnt = 0; } }
    if (again) invalidate();
  }

  /* ----- 화면에서 부르는 것 ----- */
  scene3d = {
    apply(id) {
      rebuild(id, !itemDrag && (id === 'sofa' || !hdlDrag));
      if (id === 'tvUnit') { rebuild('tv', false); if (state.shelf.on) rebuild('shelf', false); }   // 스탠드 TV는 거실장 위에, 선반 판은 거실장 색에 맞춘다
      const cx = cxOf(state);
      if (cx !== cxNow) { if (itemDrag) placeAxis(cx); else { const from = cxNow; tween(360, t => { placeAxis(from + (cx - from) * easeOut(t)); rebuildDimsSoon(); }, 'axis'); } if (id !== 'sofa') rebuild('sofa', false); }   // 끄는 중에는 손가락을 바로 따라가게   // 선반이 들고 나면 소파도 가운데를 다시 잡는다
      shadowDirty = true; rebuildDims();
    },
    select(id, fly) { rebuildDims(); if (fly !== false && ui.view === '3d') flyTo(VIEW[id]); },
    relayout() {   // 거실 크기를 바꿨을 때: 벽을 다시 세우고 품목을 새 자리에, 카메라는 새 크기에 맞춘다
      buildShell(); shadowBox();
      for (const it of ITEMS) rebuild(it.id, false);
      placeAxis(cxOf(state));
      living.position.z = Math.min(0, SOFA.back - 1.52);   // 깊이가 얕으면 러그와 테이블을 TV 쪽으로 당겨 소파와 겹치지 않게
      placeTable();
      if (!hdlDrag) resize();   // 손잡이를 끄는 동안 카메라가 물러나면 손가락 아래 바닥 자리가 바뀌어 크기가 끝까지 튄다. 놓을 때 맞춘다
      shadowDirty = true; rebuildDims();
    },
    setView(v) {
      if (v === ui.view) return;
      const swap = () => {
        ui.view = v; cam = v === 'plan' ? ortho : persp; controls.enabled = v === '3d';
        sun.position.set(...(v === 'plan' ? SUN.plan : SUN.d3)); shadowDirty = true;
        $('v3d').setAttribute('aria-pressed', v === '3d'); $('vplan').setAttribute('aria-pressed', v === 'plan');
        $('hint').classList.add('off');
        rebuildDims(); invalidate();
      };
      if (reduce) return swap();
      canvas.classList.add('fade'); labelsEl.style.opacity = 0;
      setTimeout(() => { swap(); requestAnimationFrame(() => { canvas.classList.remove('fade'); labelsEl.style.opacity = ''; }); }, 170);
    },
    setDims(on) { ui.dims = on; $('dimbtn').setAttribute('aria-pressed', on); rebuildDims(); },
    zoom(k) {
      if (ui.view === 'plan') { planZoom = Math.min(2.2, Math.max(0.8, planZoom / k)); ortho.zoom = planZoom; ortho.updateProjectionMatrix(); invalidate(); return; }
      const d = persp.position.clone().sub(controls.target), r0 = d.length(), r1 = Math.min(controls.maxDistance, Math.max(controls.minDistance, r0 * k));
      tween(220, t => { d.setLength(r0 + (r1 - r0) * easeOut(t)); persp.position.copy(controls.target).add(d); zoomK = d.length() / fit; }, 'cam');
    },
  };
  let dimSoon = 0;
  function rebuildDimsSoon() { if (!dimSoon) dimSoon = requestAnimationFrame(() => { dimSoon = 0; rebuildDims(); }); }

  $('v3d').addEventListener('click', () => scene3d.setView('3d'));
  $('vplan').addEventListener('click', () => scene3d.setView('plan'));
  $('dimbtn').addEventListener('click', () => scene3d.setDims(!ui.dims));
  $('zin').addEventListener('click', () => scene3d.zoom(0.82));
  $('zout').addEventListener('click', () => scene3d.zoom(1.22));
  canvas.addEventListener('keydown', e => {
    const step = { ArrowLeft: [-8, 0], ArrowRight: [8, 0], ArrowUp: [0, -5], ArrowDown: [0, 5] }[e.key];
    if (e.key === '+' || e.key === '=') { scene3d.zoom(0.82); e.preventDefault(); return; }
    if (e.key === '-') { scene3d.zoom(1.22); e.preventDefault(); return; }
    if (!step || ui.view !== '3d') return;
    e.preventDefault();
    const d = persp.position.clone().sub(controls.target); sph.setFromVector3(d);
    sph.theta = Math.min(controls.maxAzimuthAngle, Math.max(controls.minAzimuthAngle, sph.theta + THREE.MathUtils.degToRad(step[0])));
    sph.phi = Math.min(controls.maxPolarAngle, Math.max(controls.minPolarAngle, sph.phi + THREE.MathUtils.degToRad(step[1])));
    persp.position.setFromSpherical(sph).add(controls.target); invalidate();
  });

  /* ----- 시작 ----- */
  for (const it of ITEMS) rebuild(it.id, false);
  placeAxis(cxNow);
  resize();
  setCam(...VIEW.home);
  new ResizeObserver(resize).observe(stage);
  rebuildDims();
  document.fonts && document.fonts.ready.then(rebuildDims);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) invalidate(); });
  setTimeout(() => $('hint').classList.add('off'), 7000);

  // 점검용: 구성 바꾸기, 차지하는 상자, 합계
  window.__room = { state, ui, change, selectTab, bboxOf: id => bboxOf(id, state), total: () => totalOf(state), text: () => requestText(state), view: v => scene3d.setView(v), room: ROOM, render: invalidate,
    meshBox: id => { scene.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(slots[id]); return b.isEmpty() ? null : { min: b.min.toArray(), max: b.max.toArray() }; } };
}
if (!window.__room) window.__room = { state, ui, change, selectTab, bboxOf: id => bboxOf(id, state), total: () => totalOf(state), text: () => requestText(state), room: ROOM };
</script>
