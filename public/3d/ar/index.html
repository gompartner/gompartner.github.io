<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>곰파트너 AR 카탈로그</title>
<meta name="description" content="중문, 파티션, 수납 가구, 테이블, 간판을 치수대로 골라 3D로 보고, 휴대폰 카메라로 실제 공간에 놓아 본 뒤 바로 견적을 받습니다.">
<meta name="theme-color" content="#0f1b3d">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AR 카탈로그">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
  // 예전 중문 AR 주소(#3-k-b-1200-2300)로 들어오면 중문 화면으로 보냅니다
  (function () { var m = location.hash.match(/^#([31sd])-/); if (m) location.replace('p.html?id=door-' + m[1]); })();
</script>
<style>
  :root { --navy: #0f1b3d; --ink: #1d1f22; --ink2: #5a6068; --line: #dde1e6; --bg: #f3f4f6; --blue: #256ef4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--ink); background: var(--bg); word-break: keep-all; }
  header { background: var(--navy); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 18px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  header .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header b { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  header .top span { font-size: 13px; opacity: .7; white-space: nowrap; }
  header h1 { margin: 18px 0 6px; font-size: clamp(22px, 4.4vw, 32px); line-height: 1.3; letter-spacing: -0.03em; }
  header p { margin: 0; font-size: 15px; line-height: 1.55; color: #c9d6f2; }
  nav { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; }
  nav button { flex: none; border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink2); }
  nav button[aria-pressed=true] { background: var(--navy); border-color: var(--navy); color: #fff; }
  nav em { font-style: normal; font-weight: 600; opacity: .7; margin-left: 4px; }
  main { padding: 16px 16px 48px; }
  h2 { font-size: 18px; margin: 22px 0 10px; letter-spacing: -0.02em; }
  h2:first-child { margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; } main { padding: 22px 24px 64px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; color: inherit; text-decoration: none; }
  .card:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .ph { position: relative; aspect-ratio: 1; background: #fff; border-bottom: 1px solid #eef0f2; }
  .ph img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .ph i { position: absolute; left: 8px; top: 8px; font-style: normal; font-size: 11.5px; font-weight: 800; color: var(--blue); background: #eef4ff; border-radius: 4px; padding: 3px 6px; }
  .tx { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .tx b { font-size: 15.5px; letter-spacing: -0.02em; }
  .tx span { font-size: 13px; color: var(--ink2); line-height: 1.45; flex: 1; }
  .tx strong { font-size: 15px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tx strong small { font-weight: 500; color: var(--ink2); font-size: 12.5px; }
  @media (hover: hover) { .card { transition: border-color .15s, transform .15s; } .card:hover { border-color: var(--navy); transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><b>곰파트너 AR 카탈로그</b><a href="maker.html" style="color:#fff;font-size:13px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 10px;white-space:nowrap">제품 등록</a></div>
  <h1>치수대로 골라 보고,<br>내 공간에 놓아 본 뒤 견적까지</h1>
  <p>제품을 누르면 폭, 높이, 색을 바꿀 수 있습니다. 휴대폰에서는 카메라로 실제 크기를 확인하고, 안경과 반지, 시계는 몸에 바로 써 봅니다.</p>
</div></header>
<nav aria-label="분류"><div class="wrap" id="cats"></div></nav>
<main><div class="wrap" id="list"></div></main>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import { CATS, PRODUCTS, fromPrice, loadExtra } from './engine.js';
await loadExtra();
const won = n => n.toLocaleString('ko-KR') + '원';
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let cur = 'all';
try { cur = sessionStorage.getItem('ar-cat') || 'all'; } catch (e) {}
function draw() {
  document.getElementById('cats').innerHTML = [{ id: 'all', name: '전체', n: PRODUCTS.length + 2 }, { id: 'wear', name: '써 보기', n: 2 }, ...CATS.map(c => ({ ...c, n: PRODUCTS.filter(p => p.cat === c.id).length })).filter(c => c.n)]
    .map(c => `<button type="button" data-c="${c.id}" aria-pressed="${c.id === cur}">${c.name}<em>${c.n}</em></button>`).join('');
  const wear = (cur === 'all' || cur === 'wear') ? `<h2>몸에 써 보기</h2><div class="grid"><a class="card" href="try.html"><div class="ph"><img src="thumbs/try-glasses.jpg" alt="" loading="lazy" width="400" height="400"><i>카메라</i></div><div class="tx"><b>안경, 선글라스</b><span>얼굴에 바로 써 봅니다. 얼굴 사진은 기기 밖으로 나가지 않습니다</span><strong>${won(89000)}<small>부터</small></strong></div></a><a class="card" href="try-hand.html"><div class="ph"><img src="thumbs/try-hand.jpg" alt="" loading="lazy" width="400" height="400"><i>카메라</i></div><div class="tx"><b>반지, 시계</b><span>손등을 비추면 바로 차 봅니다. 손 사진은 기기 밖으로 나가지 않습니다</span><strong>${won(59000)}<small>부터</small></strong></div></a></div>` : '';
  document.getElementById('list').innerHTML = wear + CATS.filter(c => (cur === 'all' || c.id === cur) && PRODUCTS.some(p => p.cat === c.id)).map(c => `<h2>${c.name}</h2><div class="grid">${
    PRODUCTS.filter(p => p.cat === c.id).map(p => `<a class="card" href="p.html?id=${encodeURIComponent(p.id)}"><div class="ph"><img src="${esc(p.thumb || `thumbs/${p.id}.jpg`)}" alt="" loading="lazy" width="400" height="400"><i>${p.local ? '이 기기에서 등록' : 'AR'}</i></div><div class="tx"><b>${esc(p.name)}</b><span>${esc(p.desc)}</span><strong>${won(fromPrice(p))}<small>부터</small></strong></div></a>`).join('')
  }</div>`).join('');
}
document.getElementById('cats').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cur = b.dataset.c; try { sessionStorage.setItem('ar-cat', cur); } catch (e) {}
  draw();
});
draw();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
