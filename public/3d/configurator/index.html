<style>
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 90deg; }
  :root {
    --bg: #e4ece9;
    --surface: #ffffff;
    --ink: #1c2422;
    --ink-2: #44504c;
    --ink-3: #5f6b67;
    --line: #d6dfdb;
    --accent: #146b56;
    --accent-ink: #ffffff;
    --over: #c25a0c;
    --over-soft: #fff1e3;
    --focus: #1f5fbf;
    --shadow: 0 1px 2px rgba(20,40,34,.10), 0 6px 18px rgba(20,40,34,.10);
    --top: env(safe-area-inset-top, 0px);
    --bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 16px; line-height: 1.5; word-break: keep-all;
    -webkit-text-size-adjust: 100%;
    font-variant-ligatures: no-contextual; font-feature-settings: "calt" 0;
  }
  button, input, select { font: inherit; color: inherit; font-feature-settings: "calt" 0; }
  button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { display: block; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  .nogl { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }

  /* 위: 상호, 메뉴, 견적 요청 */
  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    padding: calc(var(--top) + 10px) 16px 0; display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink); text-decoration: none; margin-right: auto; }
  .brand b { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .brand small { font-size: 12px; color: var(--ink-2); background: var(--surface); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  .ibtn {
    width: 44px; height: 44px; flex: none; display: inline-grid; place-items: center; padding: 0;
    background: var(--surface); border: 0; border-radius: 10px; color: var(--ink); box-shadow: var(--shadow);
  }
  .ibtn svg { width: 22px; height: 22px; }
  .cta {
    height: 44px; padding: 0 16px; border: 0; border-radius: 10px; font-weight: 700; font-size: 16px;
    background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); white-space: nowrap;
  }
  .cta:active { transform: translateY(1px); }

  .menu {
    position: fixed; z-index: 8; top: calc(var(--top) + 60px); right: 16px; width: 220px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 8px;
  }
  .menu a, .menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 12px; border: 0; background: none; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 16px; text-align: left; }
  .menu a[aria-current="page"] { font-weight: 700; background: #eef4f1; }
  .menu a:hover, .menu button:hover { background: #f2f5f4; }
  .menu button svg { width: 20px; height: 20px; color: var(--ink-2); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .menu p { margin: 8px 12px 6px; font-size: 13px; color: var(--ink-3); }

  /* 폭과 금액 */
  .info {
    position: fixed; z-index: 4; left: 50%; top: calc(var(--top) + 64px); transform: translateX(-50%);
    display: flex; align-items: stretch; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums; max-width: calc(100vw - 32px);
  }
  .info button { border: 0; background: none; padding: 6px 14px; min-height: 52px; text-align: left; display: flex; align-items: center; gap: 8px; }
  .wbtn { border-radius: 12px 0 0 12px; }
  .wbtn svg { width: 22px; height: 22px; flex: none; color: var(--ink-2); }
  .wbtn span { display: grid; line-height: 1.25; }
  .wbtn b { font-size: 16px; white-space: nowrap; }
  .wbtn small { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .wbtn.over { background: repeating-linear-gradient(-45deg, var(--over-soft) 0 8px, #ffe2c4 8px 16px); }
  .wbtn.over small, .wbtn.over svg { color: var(--over); font-weight: 700; }
  .pbtn { border-left: 1px solid var(--line) !important; border-radius: 0 12px 12px 0; position: relative; }
  .pbtn b { font-size: 18px; white-space: nowrap; }
  .delta {
    position: absolute; right: 12px; top: 100%; margin-top: 6px; font-style: normal; font-size: 13px; font-weight: 700;
    background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
    visibility: hidden; transform: translateY(-4px); transition: transform .25s, visibility 0s .25s;
  }
  .delta.on { visibility: visible; transform: none; transition: transform .25s; }

  .wallpop {
    position: fixed; z-index: 6; left: 50%; top: calc(var(--top) + 124px); transform: translateX(-50%);
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; display: flex; align-items: center; gap: 6px;
  }
  .wallpop label { font-size: 14px; color: var(--ink-2); padding: 0 6px 0 4px; white-space: nowrap; }
  .wallpop input {
    width: 92px; height: 44px; border: 1px solid #c7d0cc; border-radius: 6px; text-align: center; font-size: 17px; font-weight: 700;
    font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .wallpop input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .wallpop .ibtn { box-shadow: none; background: #eef3f1; }
  .wallpop em { font-style: normal; font-size: 14px; color: var(--ink-3); }

  /* 3D 위 칸 도구 */
  .act {
    position: fixed; z-index: 3; left: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 6px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); visibility: hidden;
  }
  .act button { width: 44px; height: 44px; border: 0; border-radius: 8px; background: #eef3f1; display: grid; place-items: center; padding: 0; color: var(--ink); }
  .act button svg { width: 24px; height: 24px; }
  .act button[aria-disabled="true"] { opacity: .38; }
  .act .del { color: #9b2c13; }
  .act .lv { min-width: 34px; text-align: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .act .sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--line); }
  .act::after {
    content: ""; position: absolute; left: var(--ax, 50%); bottom: -6px; width: 12px; height: 12px; margin-left: -6px;
    background: var(--surface); transform: rotate(45deg); border-radius: 2px;
  }
  .act.below::after { bottom: auto; top: -6px; }

  /* 아래: 트레이 */
  .tray {
    position: fixed; z-index: 4; left: 16px; right: 16px; bottom: calc(var(--bot) + 12px);
    display: flex; align-items: center; gap: 3px; padding: 6px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
  }
  .tile {
    flex: 1 1 0; min-width: 0; height: 68px; border: 0; border-radius: 10px; background: #f0f4f2;
    display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; padding: 6px 0;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .tile svg { width: 32px; height: 32px; color: var(--ink); }
  .tile span { font-size: 12px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
  .tile:active { background: #dde8e3; }
  .tile[aria-disabled="true"] { opacity: .4; }
  .tdiv { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); flex: none; }
  .swbtn {
    width: 50px; height: 50px; flex: none; border-radius: 50%; border: 3px solid #fff; padding: 0; margin-left: 2px;
    box-shadow: 0 0 0 1px #c7d0cc, 0 2px 6px rgba(0,0,0,.18); position: relative;
  }
  .swbtn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--ink), 0 2px 6px rgba(0,0,0,.18); }

  /* 견본 부채: 트레이 위로 펼칩니다 */
  .fan { position: fixed; z-index: 6; left: 0; top: 0; width: 0; height: 0; visibility: hidden; }
  .fan.on { visibility: visible; }
  .blade {
    position: absolute; left: 0; top: -23px; width: 200px; height: 46px; transform-origin: 0 50%;
    transform: rotate(calc(var(--a) * -1)); pointer-events: none;
    transition: --a .46s cubic-bezier(.3, 1.45, .55, 1);
  }
  .chipc {
    position: absolute; left: 106px; right: 0; top: 0; bottom: 0; border-radius: 23px; border: 3px solid #fff; padding: 0;
    pointer-events: auto; box-shadow: 0 2px 8px rgba(0,0,0,.22); transition: transform .2s;
  }
  .blade::before {
    content: ""; position: absolute; left: 30px; width: 80px; top: 18px; height: 10px; border-radius: 5px;
    background: var(--c, #ddd); box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.2);
  }
  .chipc[aria-pressed="true"] { transform: translateX(10px); box-shadow: 0 0 0 2px var(--ink), 0 2px 8px rgba(0,0,0,.22); }
  .fanhead {
    position: fixed; z-index: 6; right: 16px; bottom: 0; display: grid; justify-items: end; gap: 6px; visibility: hidden;
  }
  .fanhead.on { visibility: visible; }
  .fanhead p {
    margin: 0; background: var(--ink); color: #fff; font-size: 14px; padding: 4px 10px; border-radius: 6px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .fabs { display: flex; gap: 6px; background: var(--surface); padding: 5px; border-radius: 12px; box-shadow: var(--shadow); }
  .fabs button { height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: none; font-size: 15px; white-space: nowrap; }
  .fabs button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }

  .toast {
    position: fixed; z-index: 7; left: 50%; bottom: calc(var(--bot) + 100px); transform: translate(-50%, 8px);
    background: var(--ink); color: #fff; border-radius: 10px; padding: 0 6px 0 16px; min-height: 48px;
    display: flex; align-items: center; gap: 6px; font-size: 15px; max-width: calc(100vw - 32px);
    visibility: hidden; transition: transform .2s, visibility 0s .2s;
  }
  .toast.on { visibility: visible; transform: translate(-50%, 0); transition: transform .2s; }
  .toast span { padding: 12px 10px 12px 0; }
  .toast button { min-height: 44px; border: 0; background: none; color: #9fe3cd; font-weight: 700; padding: 0 10px; white-space: nowrap; }

  /* 견적 시트 */
  dialog.sheet {
    border: 0; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 90dvh;
    border-radius: 16px 16px 0 0; background: var(--surface); color: var(--ink); overflow: hidden;
  }
  dialog.sheet[open] { animation: sheet-up .32s cubic-bezier(.2,.9,.3,1); }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  dialog.sheet::backdrop { background: rgba(16,28,24,.32); }
  .sheet-in { max-height: 90dvh; overflow-y: auto; padding: 8px 16px calc(var(--bot) + 16px); }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -8px; background: var(--surface); padding: 6px 0; z-index: 1; }
  .sheet-h h2 { font-size: 19px; margin: 0; }
  .sheet-h .ibtn { box-shadow: none; }
  .sum { display: grid; gap: 2px; padding: 12px 14px; background: #f0f4f2; border-radius: 10px; }
  .sum b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .sum p { margin: 0; font-size: 14px; color: var(--ink-2); }
  details.parts { margin-top: 8px; }
  details.parts summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-size: 15px; color: var(--ink-2); list-style: none; }
  details.parts summary::-webkit-details-marker { display: none; }
  details.parts summary::after { content: ""; width: 8px; height: 8px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg); margin: -4px 0 0 10px; }
  details.parts[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
  details.parts + details.parts { margin-top: 0; border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; padding-left: 12px; }
  td small { display: block; color: var(--ink-3); font-size: 13px; }
  .seg { display: flex; gap: 6px; padding-bottom: 6px; }
  .seg label { flex: 1; min-width: 0; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: grid; place-items: center; text-align: center; min-height: 52px; border-radius: 8px; border: 1px solid #c7d0cc; font-size: 14px; line-height: 1.25; padding: 4px; cursor: pointer;
  }
  .seg span small { font-size: 12px; color: var(--ink-3); }
  .seg input:checked + span { border: 2px solid var(--ink); font-weight: 700; }
  .seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  form .in { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); margin-top: 12px; }
  form input, form select {
    height: 48px; border: 1px solid #b9c4bf; border-radius: 6px; padding: 0 12px; font-size: 17px; color: var(--ink); background: #fff; width: 100%;
  }
  form [aria-invalid="true"] { border-color: #b3261e; border-width: 2px; }
  .err { color: #b3261e; font-size: 13px; }
  .err:empty { display: none; }
  .send { width: 100%; height: 52px; margin-top: 18px; font-size: 17px; }
  .done { padding: 4px 0; outline: none; }
  .done h3 { font-size: 19px; margin: 6px 0 12px; }
  .done dl { margin: 0; display: grid; grid-template-columns: 82px 1fr; gap: 8px 12px; font-size: 15px; }
  .done dt { color: var(--ink-3); }
  .done dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .line-btn { width: 100%; height: 48px; margin-top: 18px; border: 1px solid #b9c4bf; background: #fff; border-radius: 10px; font-size: 16px; }
  .foot { margin: 20px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); text-align: center; }

  @media (min-width: 900px) {
    .top { padding: 18px 24px 0; }
    .brand b { font-size: 24px; }
    .info { top: 20px; }
    .info button { min-height: 56px; padding: 6px 18px; }
    .wbtn b { font-size: 18px; } .pbtn b { font-size: 20px; }
    .wallpop { top: 86px; }
    .menu { top: 72px; right: 24px; }
    .tray { left: 50%; right: auto; transform: translateX(-50%); width: 640px; bottom: 24px; padding: 10px; gap: 8px; }
    .tile { height: 80px; }
    .tile svg { width: 38px; height: 38px; }
    .tile span { font-size: 14px; }
    .tile:hover { background: #e4ede9; }
    .swbtn { width: 64px; height: 64px; }
    .toast { bottom: 132px; }
    dialog.sheet { margin: 16px 16px 16px auto; width: 440px; max-height: calc(100dvh - 32px); border-radius: 16px; }
    dialog.sheet[open] { animation-name: sheet-in; }
    @keyframes sheet-in { from { transform: translateX(110%); } }
    .sheet-in { max-height: calc(100dvh - 32px); padding: 12px 24px 24px; }
  }
  @media (max-width: 370px) {
    .brand small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blade, .chipc, .delta, .toast { transition: none !important; }
    dialog.sheet[open] { animation: none; }
  }
  /* 11-04 다른 카탈로그 데모와 같은 맨 위 곰파트너 바로가기 줄(40px, 검정) */
  .gp-bar { height: 40px; background: #15171c; color: #fff; z-index: 40; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .gp-bar > div { max-width: 1248px; height: 100%; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; }
  .gp-bar a { display: inline-flex; align-items: center; min-height: 40px; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
  .gp-bar a:hover { color: #8fb4ff; }
  .gp-bar a:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
  /* PC는 위치가 px로 따로 정해져 있어 바로가기 줄(40px)만큼 내린다 */
  @media (min-width: 900px) { .top { padding-top: 58px; } .info { top: 60px; } .wallpop { top: 126px; } .menu { top: 112px; } }
  @media (min-width: 768px) { .gp-bar > div { padding: 0 24px; } }
  .gp-bar { position: fixed; top: 0; left: 0; right: 0; }
  :root { --top: calc(env(safe-area-inset-top, 0px) + 40px) !important; }
</style>

<h1 class="sr">시스템 선반 구성하기</h1>

<div class="top">
  <a class="brand" href="./"><b>가구 쇼룸</b><small>곰파트너 카탈로그</small></a>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

  <button class="cta" type="button" id="to-quote">견적 요청</button>
</div>
<nav class="menu" id="menu" aria-label="주요 메뉴" hidden>
  <a href="../sofa/">모듈 소파</a>
  <a href="./" aria-current="page">시스템 선반</a>
  <a href="../">카탈로그 목록</a>
  <hr>
  <button type="button" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>구성 링크 복사</button>
  <p>가구 쇼룸 | 곰파트너 카탈로그</p>
</nav>

<div class="info">

  <button class="tile" type="button" data-t="c8"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M10 5v31M33 5v31" stroke-width="2.6"/><path d="M10 9h23M10 20h23M10 31h23"/><path d="M2 20h5M4 17.5 1.5 20 4 22.5" stroke-linecap="round"/></svg><span>칸 800</span></button>
  <span class="tdiv" aria-hidden="true"></span>

      <h3>견적 요청을 받았습니다</h3>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const wide = () => innerWidth >= 900;

// ---------- 상품 정보와 단가 (부가세 포함) ----------
const ROW_H = 0.36, FOOT = 0.08, POST = 0.02, SHELF_T = 0.025, GAP = 0.02;
const FRAMES = [
  { id: 'w', name: '퓨어 화이트', hex: '#eeece8', color: 0xe9e7e2 },
  { id: 'g', name: '웜 그레이', hex: '#9b968d', color: 0x8f8a81 },
  { id: 'k', name: '차콜 블랙', hex: '#2b2b2b', color: 0x272727 },
  { id: 'o', name: '세이지 그린', hex: '#6f7d62', color: 0x657358 }
];
// 선반 1장 단가: 폭 800mm 기존 단가, 폭 600mm는 3/4
const MATS = [
  { id: 's', name: '스틸 선반', sub: '분체도장, 프레임과 같은 색', cap: '스틸 선반, 프레임과 같은 색', price: { 8: 22000, 6: 17000 } },
  { id: 'b', name: '자작나무 합판', sub: '18mm 합판, 무광 오일', cap: '자작나무 합판 18mm, 무광 오일', price: { 8: 29000, 6: 22000 } },
  { id: 'a', name: '오크 원목', sub: '집성목, 오일 마감', cap: '오크 원목 집성목, 오일 마감', price: { 8: 46000, 6: 35000 } }
];
const DEPTHS = [
  { id: 3, label: '350mm', d: 0.35, add: 0 },
  { id: 4, label: '450mm', d: 0.45, add: 6000 }
];
const ACCS = [
  { id: 'e', name: '빈칸', sub: '선반만', price: 0 },
  { id: 's', name: '중간 선반', sub: '칸 가운데에 선반 1장 더', price: 0 },
  { id: 'd', name: '서랍', sub: '2단, 소프트 클로징', price: 98000 },
  { id: 'o', name: '도어', sub: '양문 여닫이', price: 69000 },
  { id: 'h', name: '행거봉', sub: '스테인리스 25mm', price: 19000 }
];
const FRAME_PRICE = rows => 39000 + rows * 10000; // 사이드 프레임 1조(기둥 2개, 가로대)
const FOOT_PRICE = 2500, DELIVERY = 40000;
const MAXC = 5, MINR = 2, MAXR = 5;
const REGIONS = ['서울', '경기', '인천', '강원', '대전, 세종, 충청', '광주, 전라', '대구, 부산, 울산, 경상', '제주'];

let nid = 1;
const newCol = (w, acc) => ({ id: nid++, w, acc: (acc || '').padEnd(MAXR, 'e').slice(0, MAXR).split('') });
const state = { cols: [newCol(8, 'd'), newCol(8, 'o')], rows: 3, depth: 3, frame: 'k', mat: 'b', wall: 2400 };
const ui = { sel: null, fan: false, tab: 'f' };
const won = n => n.toLocaleString('ko-KR') + '원';
const mm = n => n.toLocaleString('ko-KR') + 'mm';
const accOf = id => ACCS.find(a => a.id === id);
const depthOf = () => DEPTHS.find(d => d.id === state.depth);
const frameOf = () => FRAMES.find(f => f.id === state.frame);
const matOf = () => MATS.find(m => m.id === state.mat);
const colW = c => c.w / 10;

// ---------- 해시 저장과 복원 ----------
function toHash() {
  return 'cfg=' + [state.rows, state.depth, state.frame, state.mat, state.wall, state.cols.map(c => c.w + c.acc.join('')).join('.')].join('-');
}
function fromHash() {
  const h = location.hash;
  let m = h.match(/cfg=([2-5])-([34])-([wgko])-([sba])-(\d{3,4})-((?:[68][esdoh]{5}\.?){1,5})$/);
  if (m) {
    const cols = m[6].split('.').filter(Boolean).map(s => newCol(+s[0], s.slice(1)));
    if (!cols.length || cols.length > MAXC) return false;
    Object.assign(state, { rows: +m[1], depth: +m[2], frame: m[3], mat: m[4], wall: Math.min(6000, Math.max(600, +m[5])), cols });
    ui.sel = null;
    return true;
  }
  // 예전 주소(열-단-깊이-프레임-선반-칸 20개)도 그대로 엽니다
  m = h.match(/cfg=(\d)-(\d)-(\d)-([wgko])-([sba])-([edoh]{20})/);
  if (!m) return false;
  const c = +m[1], r = +m[2], d = +m[3];
  if (c < 1 || c > 4 || r < MINR || r > MAXR || !DEPTHS.some(x => x.id === d)) return false;
  const cols = [];
  for (let i = 0; i < c; i++) { let a = ''; for (let k = 0; k < MAXR; k++) a += m[6][k * 4 + i]; cols.push(newCol(8, a)); }
  Object.assign(state, { rows: r, depth: d, frame: m[4], mat: m[5], cols });
  ui.sel = null;
  return true;
}
fromHash();

// ---------- 견적 계산 (폭 800mm 칸만 쓰면 기존 계산과 같습니다) ----------
function computeParts() {
  const { cols, rows } = state;
  const dep = depthOf(), mat = matOf();
  const list = [];
  list.push({ name: `사이드 프레임 ${rows}단용`, sub: `높이 ${mm(dimsMM().h)}, 기둥 2개와 가로대`, qty: cols.length + 1, unit: FRAME_PRICE(rows) + dep.add });
  for (const w of [8, 6]) {
    const cs = cols.filter(c => c.w === w);
    if (!cs.length) continue;
    let extra = 0;
    for (const c of cs) for (let r = 0; r < rows; r++) if (c.acc[r] === 's') extra++;
    list.push({ name: mat.name, sub: `폭 ${w}00mm, 깊이 ${mm(Math.round(dep.d * 1000))}${extra ? ', 중간 선반 ' + extra + '장 포함' : ''}`, qty: cs.length * (rows + 1) + extra, unit: mat.price[w] + Math.round(dep.add / 2) });
  }
  list.push({ name: '수평 조절 발', sub: '높이 조절 10mm', qty: (cols.length + 1) * 2, unit: FOOT_PRICE });
  for (const a of ACCS.slice(2)) {
    let n = 0;
    for (const c of cols) for (let r = 0; r < rows; r++) if (c.acc[r] === a.id) n++;
    if (n) list.push({ name: a.name, sub: a.sub, qty: n, unit: a.price });
  }
  list.push({ name: '배송 및 조립 설치', sub: '수도권 기본', qty: 1, unit: DELIVERY });
  const total = list.reduce((s, p) => s + p.qty * p.unit, 0);
  return { list, total };
}
function dimsMM() {
  return {
    w: state.cols.reduce((s, c) => s + c.w * 100, 0) + 20,
    d: Math.round(depthOf().d * 1000),
    h: Math.round((FOOT + state.rows * ROW_H + 0.02) * 1000)
  };
}

// 합계: 숫자가 짧게 굴러가며 바뀌고, 변동액이 잠깐 보입니다
let totTarget = null, totShown = 0, totRaf = 0;
function setTotal(v) {
  const el = $('total');
  if (totTarget === null) { totTarget = totShown = v; el.textContent = won(v); return; }
  if (v === totTarget) return;
  const d = v - totTarget;
  totTarget = v;
  const de = $('delta');
  de.textContent = (d > 0 ? '+' : '-') + won(Math.abs(d));
  de.classList.add('on');
  clearTimeout(de._t); de._t = setTimeout(() => de.classList.remove('on'), 1500);
  cancelAnimationFrame(totRaf);
  if (reduce) { totShown = v; el.textContent = won(v); return; }
  const from = totShown, t0 = performance.now(), dur = 450;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - (1 - k) ** 3;
    totShown = k < 1 ? Math.round((from + (v - from) * e) / 1000) * 1000 : v;
    el.textContent = won(totShown);
    if (k < 1) totRaf = requestAnimationFrame(tick);
  };
  totRaf = requestAnimationFrame(tick);
}

const MAT_BG = {
  b: 'linear-gradient(90deg,#e7d3b0,#dcc39b 40%,#e9d7b6)',
  a: 'linear-gradient(90deg,#b98a57,#a7773f 45%,#c09363)'
};
const matBg = id => id === 's' ? `linear-gradient(135deg, rgba(255,255,255,.28), rgba(255,255,255,0) 50%, rgba(0,0,0,.16)), ${frameOf().hex}` : MAT_BG[id];

// ---------- 화면 반영 ----------
function renderInfo() {
  const { list, total } = computeParts();
  const d = dimsMM();
  $('wtxt').textContent = `폭 ${mm(d.w)}`;
  const over = d.w - state.wall;
  $('wbtn').classList.toggle('over', over > 0);
  $('wsub').textContent = over > 0 ? `벽보다 ${mm(over)} 넘침` : `벽 ${mm(state.wall)}, ${over === 0 ? '꼭 맞음' : '남는 폭 ' + mm(-over)}`;
  setTotal(total);
  $('qt-total').textContent = won(total);
  const nw = t => `<span style="white-space:nowrap">${t}</span>`;
  $('qt-what').innerHTML = `${nw(state.cols.length + '열 ' + state.rows + '단')}, ${nw(frameOf().name + ' 프레임')}, ${nw(matOf().name)}, ${nw('폭 ' + mm(d.w) + ', 높이 ' + mm(d.h))}`;
  $('parts').innerHTML = list.map(p =>
    `<tr><td>${p.name}<small>${p.sub}${p.qty > 1 ? ', 1개 ' + won(p.unit) : ''}</small></td><td class="n">${p.qty}개</td><td class="n">${won(p.qty * p.unit)}</td></tr>`).join('') +
    `<tr><td><b>합계</b></td><td></td><td class="n"><b>${won(total)}</b></td></tr>`;
  const n = state.cols.length;
  $('depths').innerHTML = DEPTHS.map(x => {
    const add = x.add * (n + 1) + Math.round(x.add / 2) * state.cols.reduce((s, c) => s + state.rows + 1 + c.acc.slice(0, state.rows).filter(a => a === 's').length, 0);
    return `<label><input type="radio" name="depth" value="${x.id}"${x.id === state.depth ? ' checked' : ''}><span>깊이 ${x.label}<small>${add ? '+' + won(add) : '기본'}</small></span></label>`;
  }).join('');
  $('swbtn').style.background = `linear-gradient(135deg, ${frameOf().hex} 0 50%, transparent 50%), ${matBg(state.mat)}`;
  $('fancap').textContent = ui.tab === 'f' ? `프레임 ${frameOf().name}` : matOf().cap;
}
function renderTray() {
  document.querySelectorAll('.tile').forEach(b => {
    const t = b.dataset.t;
    let reason = '', label = '';
    if (t[0] === 'c') {
      reason = state.cols.length >= MAXC ? `칸은 ${MAXC}열까지 붙일 수 있습니다` : '';
      label = `폭 ${t[1]}00mm 칸 붙이기`;
    } else label = `${accOf(t).name} 끼우기`;
    b.setAttribute('aria-disabled', reason ? 'true' : 'false');
    b.dataset.why = reason;
    b.setAttribute('aria-label', label);
  });
}

const ICON = {
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  width: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5v14M21 5v14M7 12h10M9.5 9.5 7 12l2.5 2.5M14.5 9.5 17 12l-2.5 2.5"/></svg>',
  colDel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v18M15 3v18M5 8h10M5 15h10"/><path d="M17.5 12h5" stroke-width="2.2"/></svg>'
};
function cellName(c, r) {
  return `${c + 1}열 ${r + 1}단 칸`;
}
function renderAct() {
  const act = $('act');
  const s = ui.sel;
  if (!s) { act.innerHTML = ''; return; }
  const col = state.cols[s.c], a = col.acc[s.r];
  const accName = accOf(a).name;
  act.setAttribute('aria-label', `${cellName(s.c, s.r)}, ${accName}`);
  const dis = (b, why) => `aria-disabled="${b}"${b ? ` data-why="${why}"` : ''}`;
  const nw = col.w === 8 ? 6 : 8;
  act.innerHTML =
    `<button type="button" class="del" data-act="clear" aria-label="${accName} 빼기" ${dis(a === 'e', '비어 있는 칸입니다')}>${ICON.trash}</button>` +
    `<span class="sep" aria-hidden="true"></span>` +
    `<button type="button" data-act="lower" aria-label="선반 높이 한 단 낮추기" ${dis(state.rows <= MINR, `${MINR}단보다 낮출 수 없습니다`)}>${ICON.down}</button>` +
    `<span class="lv" aria-live="polite">${state.rows}단</span>` +
    `<button type="button" data-act="raise" aria-label="선반 높이 한 단 높이기" ${dis(state.rows >= MAXR, `${MAXR}단까지 높일 수 있습니다`)}>${ICON.up}</button>` +
    `<span class="sep" aria-hidden="true"></span>` +
    `<button type="button" data-act="width" aria-label="이 열 폭을 ${nw}00mm로 바꾸기">${ICON.width}</button>` +
    `<button type="button" class="del" data-act="coldel" aria-label="${s.c + 1}열 빼기" ${dis(state.cols.length <= 1, '마지막 열이라 뺄 수 없습니다')}>${ICON.colDel}</button>`;
}

function update(opts = {}) {
  if (ui.sel && (ui.sel.c >= state.cols.length || ui.sel.r >= state.rows)) ui.sel = null;
  renderInfo(); renderTray(); renderAct();
  history.replaceState(null, '', '#' + toHash());
  if (scene3d) scene3d.build(opts);
}

// ---------- 알림 ----------
const toastEl = $('toast'), toastT = $('toast-t'), toastU = $('toast-undo');
let undoFn = null;
function toast(text, undo) {
  toastT.textContent = text;
  undoFn = undo || null;
  toastU.hidden = !undo;
  toastEl.classList.add('on');

  const fr = { S: 3, cx: 0, cy: 0, init: false };
  let actCell = null, layout = null;

  function build(opts = {}) {
    now = performance.now() / 1000;
    const { rows } = state;
    const D = depthOf().d, dk = state.depth;
    const H = FOOT + rows * ROW_H + 0.02;
    const ZC = GAP + D / 2;
    const ih = ROW_H - SHELF_T;
    const target = new THREE.Color(frameOf().color);
    for (const p of parts.values()) p.alive = false;
    const fresh = first || opts.fresh;

    // 열 위치: 왼쪽 벽 모서리에서 시작
    let x = POST / 2;
    const cols = state.cols.map((c, i) => { const w = colW(c); const o = { c, i, w, x0: x, cx: x + w / 2, x1: x + w }; x += w; return o; });
    const shelfW = x + POST / 2;
    layout = { cols, ZC, D, H };
    lastW = shelfW;

    const enterFor = (col, k) => {
      if (fresh) return { from: V(1.6 + col.i * 0.25, 0, 0), t: now + 0.25 + col.i * 0.16 + k * 0.025 };
      if (opts.slide === col.c.id) return { from: V(1.5, 0, 0), t: now + k * 0.025 };
      return null;
    };
    const dropIn = (k) => ({ from: V(0, 0.55, 0), t: now + 0.05 + k * 0.03 });
    const popIn = (delay) => ({ from: V(0, 0.22, 0.75), t: now + delay });
    const frameSig = rows + '-' + dk;
    const mkFrame = mats => { const g = makeFrame(H, D, rows, mats); g.userData.h = H; return g; };

    // 프레임: 맨 왼쪽 하나, 열마다 오른쪽 하나
    want('fstart', frameSig, mkFrame, V(POST / 2, 0, ZC), fresh ? { from: V(1.6, 0, 0), t: now + 0.25 } : null, 'frame');
    for (const col of cols) {
      const id = col.c.id, wk = col.c.w;
      want('fr' + id, frameSig, mkFrame, V(col.x1, 0, ZC), enterFor(col, 0), 'frame');
      for (let r = 0; r <= rows; r++) {
        const isNewTop = opts.grow && !parts.has(`s${id}-${r}`);
        const p = want(`s${id}-${r}`, wk + '-' + dk, mats => makeShelf(col.w - POST, D, state.mat === 's' ? mats.steel : woodMats[state.mat]), V(col.cx, FOOT + r * ROW_H, ZC), isNewTop && !fresh ? dropIn(col.i) : enterFor(col, 1 + r), 'shelf');
        if (opts.hop && !reduce) p.hop = now + col.i * 0.07 + r * 0.04;
        else if (opts.hop) setShelfMat(p);
      }
      const iw = col.w - POST - 0.012;
      for (let r = 0; r < rows; r++) {
        const a = col.c.acc[r];
        if (a === 'e') continue;
        const yc = FOOT + r * ROW_H + SHELF_T / 2 + ih / 2;
        const key = `a${id}-${r}-${a}-${wk}-${dk}`;
        const isPop = opts.pop && opts.pop.id === id && opts.pop.r === r;
        const en = fresh ? { from: V(0, 0.22, 0.75), t: now + 0.95 + col.i * 0.16 + r * 0.08 } : isPop ? popIn(0) : (!parts.has(key) ? popIn(0.05) : enterFor(col, 2 + r));
        let p;
        if (a === 's') p = want(key, 's', mats => makeShelf(col.w - POST, D, state.mat === 's' ? mats.steel : woodMats[state.mat]), V(col.cx, yc, ZC), en, 'shelf');
        else if (a === 'd') p = want(key, 'd', mats => makeDrawer(iw, ih, D, mats), V(col.cx, yc, ZC), en, 'acc');
        else if (a === 'o') p = want(key, 'o', mats => makeDoor(iw, ih, D, mats), V(col.cx, yc, ZC), en, 'acc');
        else if (a === 'h') p = want(key, 'h', () => makeHanger(iw, ih, D), V(col.cx, yc, ZC), en, 'acc');
        if (a === 's' && opts.hop && !reduce) p.hop = now + col.i * 0.07 + r * 0.04 + 0.02;
        else if (a === 's' && opts.hop) setShelfMat(p);
        if ((isPop || fresh) && (a === 'd' || a === 'o') && !reduce && p.preview === null) p.preview = (en ? en.t : now) + 0.55;
      }
    }
    // 소품: 비어 있는 위 칸부터
    const empty = [];
    for (let r = rows - 1; r >= 1; r--) for (const col of cols) if (col.c.acc[r] === 'e') empty.push({ col, r });
    const cellFloor = (col, r) => V(col.cx, FOOT + r * ROW_H + SHELF_T / 2, ZC + 0.02);
    const late = fresh ? { from: V(0, 0.5, 0), t: now + 1.5 } : { from: V(0, 0.4, 0), t: now + 0.15 };
    if (empty[0]) want(`books-${empty[0].col.c.id}-${empty[0].r}`, 'b', makeBooks, cellFloor(empty[0].col, empty[0].r), late, 'prop');
    if (empty[1]) want(`bowl-${empty[1].col.c.id}-${empty[1].r}`, 'w', makeBowl, cellFloor(empty[1].col, empty[1].r).add(V(-0.08, 0, 0)), late, 'prop');
    const lc = cols[cols.length - 1];
    want('vase-' + lc.c.id, 'v', makeVase, V(lc.cx + (lc.w > 0.7 ? 0.18 : 0.12), H - 0.02 + SHELF_T / 2 + 0.0005, ZC), late, 'prop');

    for (const p of parts.values()) if (p.kind === 'shelf' && p.alive && p.hop === null && p.obj.material !== (state.mat === 's' ? p.mats.steel : woodMats[state.mat])) setShelfMat(p);
    for (const p of parts.values()) if (!p.alive && !p.dying) { p.dying = true; p.vy = 1.2; p.hop = null; p.preview = null; p.obj.visible = true; }

    // 색: 왼쪽에서 오른쪽으로 번집니다
    if (opts.recolor || first) {
      for (const p of parts.values()) {
        if (p.dying) continue;
        p.col = { t0: now + (first || reduce ? 0 : 0.03 + p.tp.x * 0.2), from: p.cf.clone(), to: target.clone() };
      }
      if (reduce || first) for (const p of parts.values()) { p.cf.copy(target); applyTint(p); p.col = null; }
    }
    frameCol.copy(target);
    for (const p of parts.values()) if (!p.col && !p.dying && !p.cf.equals(target)) { p.cf.copy(target); applyTint(p); }

    // 방 크기
    const wallM = state.wall / 1000, span = Math.max(wallM, shelfW);
    room.twall = wallM; room.tfw = span + 0.55; room.tfd = Math.max(1.25, D + 0.95);
    const hs = Math.round(shelfW * 1000) + '-' + state.wall;
    if (hs !== hrSig || opts.ruler) { hrSig = hs; drawHRuler(wallM, shelfW); }
    const vs = String(rows);
    if (vs !== vrSig || opts.ruler) { vrSig = vs; drawVRuler(H); }
    vrTX = shelfW + 0.05 + VR_W / 2;
    const over = shelfW - wallM;
    overFloor.visible = over > 0.0005;
    if (overFloor.visible) {
      const dep = D + 0.5;
      overFloor.scale.set(over, dep, 1);
      overFloor.position.set(wallM + over / 2, 0.004, dep / 2);
      stripeTex.repeat.set(Math.max(1, over / 0.1), Math.max(1, dep / 0.1));
    }
    if (first || reduce) { room.fw = room.tfw; room.fd = room.tfd; room.wall = room.twall; vrX = vrTX; }

    // 누를 자리
    hitGroup.clear(); hits.length = 0;
    for (const col of cols) for (let r = 0; r < rows; r++) {
      const m = new THREE.Mesh(box1, hitMat);
      m.visible = false;
      m.position.set(col.cx, FOOT + (r + 0.5) * ROW_H, ZC);
      m.scale.set(col.w - POST, ROW_H - SHELF_T, D);
      m.userData = { c: col.i, r };
      hitGroup.add(m); hits.push(m);
    }
    actCell = null;
    if (ui.sel) {
      const col = cols[ui.sel.c];
      selTP.set(col.cx, FOOT + (ui.sel.r + 0.5) * ROW_H, ZC + 0.004);
      selTS.set(col.w - POST - 0.004, ROW_H - SHELF_T - 0.004, D + 0.012);
      if (!selInit || reduce || !selGroup.visible) { selGroup.position.copy(selTP); selGroup.scale.copy(selTS); selInit = true; }
      selGroup.visible = true; selPulse = now;
      actCell = { x: col.cx, y: FOOT + (ui.sel.r + 1) * ROW_H, yb: FOOT + ui.sel.r * ROW_H, z: ZC + D / 2 };
    } else selGroup.visible = false;

    // 화면 맞춤
    goalB.bMin.set(-WALL_T - 0.05, 0, -WALL_T);
    goalB.bMax.set(span + 0.25, WALL_H, room.tfd);
    goalB.sMin.set(-WALL_T, 0, 0);
    goalB.sMax.set(Math.max(shelfW + VR_W + 0.15, Math.min(wallM, 1.2)), WALL_H, D + 0.3);
    if (first) {
      for (const k of ['bMin', 'bMax', 'sMin', 'sMax']) box[k].copy(goalB[k]);
      if (!reduce) { box.bMax.multiplyScalar(1.35); box.sMax.multiplyScalar(1.35); }
    }
    sun.shadow.camera.left = -3; sun.shadow.camera.right = 3.4 + span / 2;
    sun.shadow.camera.top = 3.2; sun.shadow.camera.bottom = -3.2;
    sun.shadow.camera.updateProjectionMatrix();
    first = false;
  }
  function setShelfMat(p) {
    const m = state.mat === 's' ? p.mats.steel : woodMats[state.mat];
    p.obj.material = m;
    if (p.obj.userData.edge) p.obj.userData.edge.visible = state.mat === 'b';
  }

  // 처음 카메라 방향
  const startDir = dirOf(reduce ? DEF_AZ : DEF_AZ + 0.4, reduce ? DEF_POLAR : DEF_POLAR - 0.3);
  controls.target.set(1.2, 1, 0.5);
  camera.position.copy(controls.target).addScaledVector(startDir, DIST);
  let introCam = !reduce, userMoved = false, held = false, lastW = 1.6;
  const goalDir = V(0, 0, 0);
  const goalDirNow = () => goalDir.copy(dirOf(DEF_AZ + (phone() ? Math.min(0.5, Math.max(0, (lastW - 1.7) * 0.26)) : 0), DEF_POLAR));

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  function pick(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(hits, false)[0];
    return hit ? hit.object.userData : null;
  }
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; held = true; });
  addEventListener('pointerup', () => { held = false; });
  addEventListener('pointercancel', () => { held = false; });
  controls.addEventListener('end', () => { held = false; });
  canvas.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved > 6) { userMoved = true; return; }
    selectAt(pick(e));
  });
  canvas.addEventListener('pointercancel', () => { down = null; });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || e.buttons) return;
    canvas.style.cursor = pick(e) ? 'pointer' : 'grab';
  });
  function size() { renderer.setSize(innerWidth, innerHeight, false); }
  addEventListener('resize', size); size();

  const v3 = V(0, 0, 0), _p = V(0, 0, 0), corners = Array.from({ length: 8 }, () => V(0, 0, 0));
  const actEl = $('act');
  const clock = new THREE.Clock();
  let actShown = false;
  const smooth = t => t * t * (3 - 2 * t);
  const clamp01 = v => Math.min(1, Math.max(0, v));
  function rectOf(min, max) {
    let i = 0;
    for (const x of [min.x, max.x]) for (const y of [min.y, max.y]) for (const z of [min.z, max.z]) corners[i++].set(x, y, z).applyMatrix4(camera.matrixWorldInverse);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const c of corners) { x0 = Math.min(x0, c.x); x1 = Math.max(x1, c.x); y0 = Math.min(y0, c.y); y1 = Math.max(y1, c.y); }
    return { x0, x1, y0, y1 };
  }
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.04);
    now = performance.now() / 1000;
    const k = reduce ? 1 : 1 - Math.exp(-dt * 7);

    for (const [key, p] of parts) {
      const o = p.obj;
      if (p.dying) {
        p.vy += dt * 9;
        o.position.y += p.vy * dt;
        o.scale.multiplyScalar(1 - dt * 1.6);
        if (o.position.y > p.tp.y + 2.4 || reduce) { root.remove(o); parts.delete(key); }
        continue;
      }
      if (p.start !== undefined) {
        if (now < p.start) { o.visible = false; continue; }
        o.visible = true; p.start = undefined;
      }
      if (reduce) { o.position.copy(p.tp); p.sy = 1; }
      else {
        // 스프링으로 착 붙습니다
        v3.copy(p.tp).sub(o.position);
        p.vel.addScaledVector(v3, 210 * dt).multiplyScalar(Math.exp(-dt * 21));
        o.position.addScaledVector(p.vel, dt);
        p.syv += ((1 - p.sy) * 260 - p.syv * 18) * dt;
        p.sy += p.syv * dt;
        if (p.hop !== null) {
          const t = (now - p.hop) / 0.5;
          if (t >= 0 && !p.hopped) { p.hopped = true; setShelfMat(p); }
          if (t >= 1) { p.hop = null; p.hopped = false; }
          else if (t > 0) o.position.y = p.tp.y + Math.sin(Math.PI * t) * 0.05;
        }
      }
      o.scale.set(1, p.sy, 1);
      if (p.col && now >= p.col.t0) {
        const t = Math.min(1, (now - p.col.t0) / 0.32);
        p.cf.copy(p.col.from).lerp(p.col.to, smooth(t));
        applyTint(p);
        if (t >= 1) p.col = null;
      }
      if (p.preview !== null && now > p.preview) {
        const t = (now - p.preview) / 2.2;
        const v = t < 0.32 ? smooth(t / 0.32) : t < 0.62 ? 1 : t < 1 ? 1 - smooth((t - 0.62) / 0.38) : 0;
        if (t >= 1) p.preview = null;
        (o.userData.slides || []).forEach(sl => { sl.s.position.z = smooth(clamp01((v * (1 + sl.lag)) - sl.lag)) * sl.amount; });
        (o.userData.pivots || []).forEach(pv => { pv.pv.rotation.y = pv.s * v * 1.45; });
      }
    }

    // 방 크기 따라가기
    room.fw += (room.tfw - room.fw) * k; room.fd += (room.tfd - room.fd) * k; room.wall += (room.twall - room.wall) * k;
    vrX += (vrTX - vrX) * k;
    const fx0 = -WALL_T;
    floorTop.scale.set(room.fw + WALL_T, room.fd + WALL_T, 1); floorTop.position.set(fx0 + (room.fw + WALL_T) / 2, 0, -WALL_T + (room.fd + WALL_T) / 2);
    floorTex.repeat.set((room.fw + WALL_T) / 1.8, (room.fd + WALL_T) / 1.8);
    slab.scale.set(room.fw + WALL_T, 0.16, room.fd + WALL_T); slab.position.set(fx0 + (room.fw + WALL_T) / 2, -0.0805, -WALL_T + (room.fd + WALL_T) / 2);
    wall.scale.set(room.wall + WALL_T, WALL_H, WALL_T); wall.position.set((room.wall - WALL_T) / 2, WALL_H / 2, -WALL_T / 2);
    base.scale.x = room.wall; base.position.set(room.wall / 2, 0.035, 0.007);
    vruler.position.set(vrX, 0.04 + VR_H / 2, 0.004);
    selGroup.position.lerp(selTP, k); selGroup.scale.lerp(selTS, k);
    selFill.material.opacity = 0.12 + (reduce ? 0 : 0.2 * clamp01(1 - (now - selPulse) / 0.8));

    // 카메라
    if (!userMoved && !held) {
      goalDirNow();
      const f = reduce ? 1 : 1 - Math.exp(-dt * (introCam ? 1.7 : 3));
      v3.copy(camera.position).sub(controls.target).normalize();
      if (v3.distanceTo(goalDir) > 0.0005) {
        v3.lerp(goalDir, f).normalize();
        camera.position.copy(controls.target).addScaledVector(v3, DIST);
      } else introCam = false;
    }
    const fk = reduce ? 1 : 1 - Math.exp(-dt * 4.2);
    for (const kk of ['bMin', 'bMax', 'sMin', 'sMax']) box[kk].lerp(goalB[kk], fk);
    _p.copy(box.bMin).add(box.bMax).multiplyScalar(0.5);
    v3.copy(_p).sub(controls.target);
    controls.target.add(v3); camera.position.add(v3);
    controls.update();
    camera.updateMatrixWorld();
    const cw = innerWidth, ch = innerHeight, aspect = cw / ch;
    const W = wide();
    const mt = W ? 96 : 128, mb = W ? 132 : 100, ms = W ? 72 : 10;
    const B = rectOf(box.bMin, box.bMax);
    let S, cx, cy;
    const yc = mt + (ch - mt - mb) / 2, ny = 1 - 2 * yc / ch;
    if (phone()) {
      // 휴대폰: 판이 화면 높이의 3분의 2쯤 차도록, 옆은 선반 기준으로 잘라 냅니다
      const Sh = (B.y1 - B.y0) / (2 * Math.min(0.68, (ch - mt - mb) / ch));
      const Sr = rectOf(box.sMin, box.sMax);
      const Sw = (Sr.x1 - Sr.x0) * ch / (2 * (cw - 2 * ms));
      S = Math.max(Sh, Sw);
      const half = S * aspect;
      const lo = B.x0 + half, hi = B.x1 - half;
      const want0 = (Sr.x0 + Sr.x1) / 2;
      cx = lo <= hi ? Math.min(hi, Math.max(lo, want0)) : (B.x0 + B.x1) / 2;
    } else {
      S = Math.max((B.y1 - B.y0) * ch / (2 * (ch - mt - mb)), (B.x1 - B.x0) * ch / (2 * (cw - 2 * ms)));
      cx = (B.x0 + B.x1) / 2;
    }
    cy = (B.y0 + B.y1) / 2 - ny * S;
    if (!fr.init || reduce) { fr.S = S; fr.cx = cx; fr.cy = cy; fr.init = true; }
    else { fr.S += (S - fr.S) * fk; fr.cx += (cx - fr.cx) * fk; fr.cy += (cy - fr.cy) * fk; }
    camera.left = fr.cx - fr.S * aspect; camera.right = fr.cx + fr.S * aspect;
    camera.top = fr.cy + fr.S; camera.bottom = fr.cy - fr.S;
    camera.updateProjectionMatrix();

    sun.target.position.set(1.4, 0, 0.4); sun.position.copy(sun.target.position).add(SUN_OFF);

    // 고른 칸 위 도구
    const show = !!actCell && actEl.childElementCount > 0;
    if (show) {
      _p.set(selGroup.position.x, selGroup.position.y + selGroup.scale.y / 2, actCell.z).project(camera);
      const x = (_p.x + 1) / 2 * cw, y = (1 - _p.y) / 2 * ch;
      const aw = actEl.offsetWidth, ah = actEl.offsetHeight;
      const lx = Math.max(8, Math.min(cw - aw - 8, x - aw / 2));
      let ly = y - ah - 14, below = false;
      const minY = W ? 90 : 124;
      if (ly < minY) {
        _p.set(selGroup.position.x, selGroup.position.y - selGroup.scale.y / 2, actCell.z).project(camera);
        ly = (1 - _p.y) / 2 * ch + 14; below = true;
      }
      actEl.classList.toggle('below', below);
      actEl.style.setProperty('--ax', Math.max(18, Math.min(aw - 18, x - lx)) + 'px');
      actEl.style.transform = `translate(${Math.round(lx)}px, ${Math.round(ly)}px)`;
    }
    if (show !== actShown) { actShown = show; actEl.style.visibility = show ? 'visible' : 'hidden'; }

    renderer.render(scene, camera);
  });

  return { build };
}
</script>
</body>
</html>
