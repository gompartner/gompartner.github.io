<style>
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 90deg; }
  :root {
    --bg: #ece8e1;
    --surface: #ffffff;
    --ink: #1e1f1f;
    --ink-2: #474a4a;
    --ink-3: #5f6262;
    --line: #dddbd6;
    --line-2: #c7c4bd;
    --accent: #2f5d50;
    --accent-ink: #ffffff;
    --accent-soft: #e6efeb;
    --tile: #f3f1ec;
    --over: #c25a0c;
    --over-soft: #fff1e3;
    --focus: #1f5fbf;
    --warn: #a3341f;
    --shadow: 0 1px 2px rgba(40,34,24,.10), 0 6px 18px rgba(40,34,24,.10);
    --top: env(safe-area-inset-top, 0px);
    --bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 16px; line-height: 1.5; word-break: keep-all;
    -webkit-text-size-adjust: 100%;
    font-variant-ligatures: no-contextual; font-feature-settings: "calt" 0;
  }
  button, input, select { font: inherit; color: inherit; font-feature-settings: "calt" 0; }
  button { -webkit-tap-highlight-color: transparent; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { display: block; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  .nogl { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }

  /* 위: 상호, 메뉴, 견적 요청 */
  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    padding: calc(var(--top) + 10px) 16px 0; display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink); text-decoration: none; margin-right: auto; min-width: 0; }
  .brand b { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  .brand small { font-size: 12px; color: var(--ink-2); background: var(--surface); border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
  .ibtn {
    width: 44px; height: 44px; flex: none; display: inline-grid; place-items: center; padding: 0;
    background: var(--surface); border: 0; border-radius: 10px; color: var(--ink); box-shadow: var(--shadow);
  }
  .ibtn svg { width: 22px; height: 22px; }
  .cta {
    height: 44px; padding: 0 16px; border: 0; border-radius: 10px; font-weight: 700; font-size: 16px;
    background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); white-space: nowrap;
  }
  .cta:active { transform: translateY(1px); }

  .menu {
    position: fixed; z-index: 8; top: calc(var(--top) + 60px); right: 16px; width: 220px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 8px;
  }
  .menu a, .menu button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 0 12px; border: 0; background: none; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 16px; text-align: left; }
  .menu a[aria-current="page"] { font-weight: 700; background: var(--accent-soft); }
  .menu a:hover, .menu button:hover { background: #f3f2ef; }
  .menu button svg { width: 20px; height: 20px; color: var(--ink-2); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .menu p { margin: 8px 12px 6px; font-size: 13px; color: var(--ink-3); }

  /* 치수와 금액 */
  .info {
    position: fixed; z-index: 4; left: 50%; top: calc(var(--top) + 64px); transform: translateX(-50%);
    display: flex; align-items: stretch; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums; max-width: calc(100vw - 32px);
  }
  .info button { border: 0; background: none; padding: 6px 12px; min-height: 52px; text-align: left; display: flex; align-items: center; gap: 8px; }
  .dbtn { border-radius: 12px 0 0 12px; }
  .dbtn svg { width: 22px; height: 22px; flex: none; color: var(--ink-2); }
  .dbtn span { display: grid; line-height: 1.25; }
  .dbtn b { font-size: 15px; white-space: nowrap; }
  .dbtn small { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .dbtn.over { background: repeating-linear-gradient(-45deg, var(--over-soft) 0 8px, #ffe2c4 8px 16px); }
  .dbtn.over small, .dbtn.over svg { color: var(--over); font-weight: 700; }
  .pbtn { border-left: 1px solid var(--line) !important; border-radius: 0 12px 12px 0; position: relative; }
  .pbtn b { font-size: 18px; white-space: nowrap; }
  .delta {
    position: absolute; right: 12px; top: 100%; margin-top: 6px; font-style: normal; font-size: 13px; font-weight: 700;
    background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
    visibility: hidden; transform: translateY(-4px); transition: transform .25s, visibility 0s .25s;
  }
  .delta.on { visibility: visible; transform: none; transition: transform .25s; }

  .dimpop {
    position: fixed; z-index: 6; left: 50%; top: calc(var(--top) + 124px); transform: translateX(-50%);
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 10px 8px;
    display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px);
  }
  .drow { display: flex; align-items: center; gap: 6px; }
  .drow label { font-size: 15px; color: var(--ink-2); width: 40px; padding-left: 4px; white-space: nowrap; }
  .drow input {
    width: 96px; height: 44px; border: 1px solid var(--line-2); border-radius: 6px; text-align: center; font-size: 17px; font-weight: 700;
    font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; background: #fff;
  }
  .drow input::-webkit-inner-spin-button, .drow input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .drow input.over { border: 2px solid var(--over); background: var(--over-soft); }
  .drow .ibtn { box-shadow: none; background: #f0eee9; }
  .drow em { font-style: normal; font-size: 14px; color: var(--ink-3); }
  .dimpop p { margin: 0 4px; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dimpop .fix { height: 44px; border: 0; border-radius: 8px; background: var(--over); color: #fff; font-weight: 700; font-size: 15px; }

  /* 줄자 손잡이 */
  .knob {
    position: fixed; z-index: 3; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; padding: 0; border-radius: 50%;
    border: 3px solid var(--accent); background: #fff; color: var(--accent); display: grid; place-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.18); touch-action: none; visibility: hidden; cursor: grab;
  }
  .knob svg { width: 22px; height: 22px; }
  .knob.over { border-color: var(--over); color: var(--over); }
  .knob.on { cursor: grabbing; background: var(--accent); color: #fff; }
  .knob.over.on { background: var(--over); }
  .kval {
    position: fixed; z-index: 4; left: 0; top: 0; padding: 3px 10px; border-radius: 6px; background: var(--ink); color: #fff;
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; pointer-events: none; visibility: hidden;
  }
  .kval.over { background: var(--over); }

  /* 3D 위 문 도구 */
  .act {
    position: fixed; z-index: 3; left: 0; top: 0; display: flex; gap: 6px; padding: 6px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); visibility: hidden;
  }
  .act button { width: 44px; height: 44px; border: 0; border-radius: 8px; background: #f0eee9; display: grid; place-items: center; padding: 0; color: var(--ink); }
  .act button svg { width: 24px; height: 24px; }
  .act button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .act .sep { width: 1px; background: var(--line); margin: 4px 2px; }

  /* 아래: 문 방식 트레이 */
  .tray {
    position: fixed; z-index: 4; left: 16px; right: 16px; bottom: calc(var(--bot) + 12px);
    display: flex; align-items: center; gap: 6px; padding: 8px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
  }
  .tile {
    flex: 1 1 0; min-width: 0; height: 68px; border: 0; border-radius: 10px; background: var(--tile);
    display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; padding: 6px 0;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .tile svg { width: 34px; height: 34px; color: var(--ink); }
  .tile span { font-size: 13px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
  .tile:active { background: #e6e2da; }
  .tile[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .tile[aria-pressed="true"] span { color: var(--accent); }
  .tdiv { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); flex: none; }
  .swbtn {
    width: 56px; height: 56px; flex: none; border-radius: 50%; border: 3px solid #fff; padding: 0;
    box-shadow: 0 0 0 1px var(--line-2), 0 2px 6px rgba(0,0,0,.18);
  }
  .swbtn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--ink), 0 2px 6px rgba(0,0,0,.18); }

  /* 견본 부채: 안쪽 줄 유리, 바깥 줄 프레임 색 */
  .fan { position: fixed; z-index: 6; left: 0; top: 0; width: 0; height: 0; visibility: hidden; }
  .fan.on { visibility: visible; }
  .blade {
    position: absolute; left: 0; top: -23px; width: 272px; height: 46px; transform-origin: 0 50%;
    transform: rotate(calc(var(--a) * -1)); pointer-events: none;
    transition: --a .46s cubic-bezier(.3, 1.45, .55, 1);
  }
  .blade::before {
    content: ""; position: absolute; left: 22px; width: 160px; top: 19px; height: 8px; border-radius: 4px;
    background: #cfcac0; box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.2);
  }
  .chip {
    position: absolute; top: 0; bottom: 0; border-radius: 23px; border: 3px solid #fff; padding: 0;
    pointer-events: auto; box-shadow: 0 2px 8px rgba(0,0,0,.22); transition: transform .2s;
  }
  .chip.g { left: 106px; width: 44px; top: 1px; bottom: 1px; }
  .chip.f { left: 180px; width: 92px; }
  .chip[aria-pressed="true"] { transform: translateX(10px); box-shadow: 0 0 0 2px var(--ink), 0 2px 8px rgba(0,0,0,.22); }
  .fanlab {
    position: absolute; transform: translate(-50%, -50%); padding: 1px 8px; border-radius: 4px; background: var(--surface);
    font-size: 12px; font-weight: 700; color: var(--ink-2); white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.14);
    opacity: 0; transition: opacity .2s .25s;
  }
  .fan.spread .fanlab { opacity: 1; }
  .fanhead { position: fixed; z-index: 6; right: 16px; bottom: 0; display: grid; justify-items: end; gap: 4px; visibility: hidden; }
  .fanhead.on { visibility: visible; }
  .fanhead p {
    margin: 0; background: var(--ink); color: #fff; font-size: 14px; padding: 4px 10px; border-radius: 6px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .toast {
    position: fixed; z-index: 7; left: 50%; bottom: calc(var(--bot) + 104px); transform: translate(-50%, 8px);
    background: var(--ink); color: #fff; border-radius: 10px; padding: 0 6px 0 16px; min-height: 48px;
    display: flex; align-items: center; gap: 6px; font-size: 15px; max-width: calc(100vw - 32px); width: max-content;
    visibility: hidden; transition: transform .2s, visibility 0s .2s;
  }
  .toast.on { visibility: visible; transform: translate(-50%, 0); transition: transform .2s; }
  .toast span { padding: 12px 10px 12px 0; }
  .toast button { min-height: 44px; border: 0; background: none; color: #ffc896; font-weight: 700; padding: 0 10px; white-space: nowrap; }

  /* 견적 시트 */
  dialog.sheet {
    border: 0; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 90dvh;
    border-radius: 16px 16px 0 0; background: var(--surface); color: var(--ink); overflow: hidden;
  }
  dialog.sheet[open] { animation: sheet-up .32s cubic-bezier(.2,.9,.3,1); }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  dialog.sheet::backdrop { background: rgba(28,24,18,.32); }
  .sheet-in { max-height: 90dvh; overflow-y: auto; padding: 8px 16px calc(var(--bot) + 16px); }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -8px; background: var(--surface); padding: 6px 0; z-index: 1; }
  .sheet-h h2 { font-size: 19px; margin: 0; }
  .sheet-h .ibtn { box-shadow: none; }
  .sum { display: grid; gap: 2px; padding: 12px 14px; background: #f3f1ec; border-radius: 10px; }
  .sum b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .sum p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .issue {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px; display: grid; gap: 8px; font-size: 14px; color: #7a3300;
    background: repeating-linear-gradient(-45deg, var(--over-soft) 0 8px, #ffe7cf 8px 16px); border: 1px solid #f1b47a;
  }
  .issue p { margin: 0; }
  .issue button { justify-self: start; min-height: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--over); color: #fff; font-weight: 700; font-size: 15px; }
  details.fold { margin-top: 8px; border-bottom: 1px solid var(--line); }
  details.fold summary { min-height: 48px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; color: var(--ink-2); list-style: none; }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary span { margin-left: auto; color: var(--ink-3); font-size: 14px; text-align: right; }
  details.fold summary::after { content: ""; flex: none; width: 8px; height: 8px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg); margin: -4px 4px 0 6px; }
  details.fold[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; padding-left: 12px; }
  td small { display: block; color: var(--ink-3); font-size: 13px; }
  .xo { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 0; border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; }
  .xo input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); margin: 0; }
  .xo span { display: grid; line-height: 1.3; }
  .xo small { font-size: 13px; color: var(--ink-3); }
  .xo em { margin-left: auto; font-style: normal; font-size: 14px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .xo.off { opacity: .45; cursor: not-allowed; }
  .xo:last-child { margin-bottom: 8px; }
  form .in { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); margin-top: 12px; min-width: 0; }
  form input {
    height: 48px; border: 1px solid #bdb9b1; border-radius: 6px; padding: 0 12px; font-size: 17px; color: var(--ink); background: #fff; width: 100%; min-width: 0;
  }
  form input[type="date"] { -webkit-appearance: none; appearance: none; display: block; line-height: 46px; text-align: left; }
  form input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  form [aria-invalid="true"] { border-color: #b3261e; border-width: 2px; }
  .row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .err { color: #b3261e; font-size: 13px; }
  .err:empty { display: none; }
  .send { width: 100%; height: 52px; margin-top: 18px; font-size: 17px; }
  .done { padding: 4px 0; outline: none; }
  .done h3 { font-size: 19px; margin: 6px 0 12px; }
  .done dl { margin: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px 12px; font-size: 15px; }
  .done dt { color: var(--ink-3); }
  .done dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .line-btn { width: 100%; height: 48px; margin-top: 18px; border: 1px solid #bdb9b1; background: #fff; border-radius: 10px; font-size: 16px; }
  .foot { margin: 20px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); text-align: center; }

  @media (min-width: 900px) {
    .top { padding: 18px 24px 0; }
    .brand b { font-size: 24px; }
    .info { top: 20px; }
    .info button { min-height: 56px; padding: 6px 18px; }
    .dbtn b { font-size: 17px; } .pbtn b { font-size: 20px; }
    .dimpop { top: 86px; }
    .menu { top: 72px; right: 24px; }
    .tray { left: 50%; right: auto; transform: translateX(-50%); width: 560px; bottom: 24px; padding: 10px; gap: 8px; }
    .tile { height: 80px; }
    .tile svg { width: 40px; height: 40px; }
    .tile span { font-size: 14px; }
    .tile:hover { background: #ebe8e1; }
    .tile[aria-pressed="true"]:hover { background: var(--accent-soft); }
    .swbtn { width: 64px; height: 64px; }
    .toast { bottom: 132px; }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const wide = () => innerWidth >= 900;

// ---------- 상품 정보와 단가 (부가세 포함) ----------
// 기본가는 폭 1000mm, 높이 2300mm까지. 그 위로 100mm마다 가산합니다.
const TYPES = [
  { id: '3', name: '3연동 슬라이딩', short: '3연동', sub: '문짝 3장이 한쪽으로 겹쳐 열림', base: 720000, perW: 33000, wMin: 1000, wMax: 2000, slide: true, leaves: 1 },
  { id: '1', name: '원슬라이딩', short: '원슬라이딩', sub: '문짝 1장과 고정창 1장', base: 620000, perW: 30000, wMin: 900, wMax: 1800, slide: true, leaves: 1 },
  { id: 's', name: '스윙 도어', short: '스윙', sub: '한쪽 경첩, 안쪽으로 열림', base: 850000, perW: 28000, wMin: 900, wMax: 1600, slide: false, leaves: 1 },
  { id: 'd', name: '양개 여닫이', short: '양개', sub: '문짝 2장이 양쪽으로 열림', base: 690000, perW: 30000, wMin: 1100, wMax: 2000, slide: false, leaves: 2 }
];
const H_MIN = 2000, H_MAX = 2500, BASE_W = 1000, BASE_H = 2300, PER_H = 25000;
// 현관 개구부로 잴 수 있는 범위 (문 방식 범위를 넘으면 주황 줄무늬로 알립니다)
const W_ALL = [700, 2400], H_ALL = [1800, 2650];
const FRAMES = [
  { id: 'w', name: '화이트', hex: '#efeeea', color: 0xeeede9, metal: 0.15, rough: 0.42, add: 0 },
  { id: 'k', name: '블랙', hex: '#262626', color: 0x222222, metal: 0.5, rough: 0.4, add: 0 },
  { id: 'b', name: '브론즈', hex: '#5d4838', color: 0x5a4434, metal: 0.7, rough: 0.36, add: 40000 },
  { id: 'c', name: '샴페인골드', hex: '#c4ad80', color: 0xbca57a, metal: 0.82, rough: 0.3, add: 60000 }
];
const GLASSES = [
  { id: 'c', name: '투명', sub: '맑은 강화유리', hex: '#dbe6e4', rate: 0, color: 0xe4eeec, opacity: 0.14, rough: 0.04 },
  { id: 'b', name: '브론즈', sub: '은은한 갈색 톤', hex: '#7d6a58', rate: 65000, color: 0x5e5044, opacity: 0.42, rough: 0.05 },
  { id: 's', name: '샤틴', sub: '불투명 산 부식', hex: '#e6e9e6', rate: 55000, color: 0xe3e8e6, opacity: 0.74, rough: 0.75 },
  { id: 'a', name: '아쿠아', sub: '물결 무늬, 반투명', hex: '#cfdcdb', rate: 65000, color: 0xd5e2e0, opacity: 0.6, rough: 0.28 }
];
const DESIGNS = [
  { id: 'f', name: '통유리', sub: '간살 없음', add: 0 },
  { id: 'v', name: '세로 간살', sub: '세로 분할', add: 60000 },
  { id: 'h', name: '가로 간살', sub: '가로 4분할', add: 50000 },
  { id: 'g', name: '격자 간살', sub: '바둑판 분할', add: 110000 }
];
const HANDLES = [
  { id: 'b', name: '일자 바 손잡이', short: '일자 바', sub: '길이 300mm', add: 0 },
  { id: 'l', name: '롱바 손잡이', short: '롱바', sub: '길이 1200mm', add: 35000 },
  { id: 'r', name: '매립 손잡이', short: '매립', sub: '프레임 홈 가공', add: 20000 }
];
const EXTRAS = [
  { id: 'hanger', name: '상부 행거형', sub: '하부 레일 없이 바닥이 매끈합니다', price: 150000 },
  { id: 'close', name: '자동 닫힘', sub: '', price: 70000 },
  { id: 'remove', name: '기존 중문 철거', sub: '폐기물 처리 포함', price: 120000 }
];
const INSTALL = 145000;

const state = { type: '3', w: 1200, h: 2300, frame: 'k', glass: 'b', design: 'v', handle: 'l', o: { hanger: false, close: true, remove: false } };
const ui = { sel: false, sub: '', fan: false, drag: null };
const typeOf = () => TYPES.find(t => t.id === state.type);
const byId = (arr, id) => arr.find(x => x.id === id);
const won = n => n.toLocaleString('ko-KR') + '원';
const mm = n => n.toLocaleString('ko-KR') + 'mm';
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
// 문이 실제로 만들어지는 크기(문 방식 범위 안)와 개구부 실측의 차이
function door() {
  const t = typeOf();
  const dw = clamp(state.w, t.wMin, t.wMax), dh = clamp(state.h, H_MIN, H_MAX);
  return { t, dw, dh, ow: state.w - dw, oh: state.h - dh };
}
function issueText(d, short) {
  const part = [];
  if (d.ow) part.push(`폭 ${mm(Math.abs(d.ow))} ${d.ow > 0 ? '넘침' : '모자람'}`);
  if (d.oh) part.push(`높이 ${mm(Math.abs(d.oh))} ${d.oh > 0 ? '넘침' : '모자람'}`);
  if (short) return part.join(', ');
  const n = d.t.name, j = (n.charCodeAt(n.length - 1) - 0xac00) % 28 ? '은' : '는';
  return `${n}${j} 폭 ${mm(d.t.wMin)}~${mm(d.t.wMax)}, 높이 ${mm(H_MIN)}~${mm(H_MAX)}까지 만듭니다. 지금 ${part.join(', ')}.`;
}

// ---------- 해시 저장과 복원 ----------
function toHash() {
  const o = ['hanger', 'close', 'remove'].map(k => state.o[k] ? 1 : 0).join('');
  return 'cfg=' + [state.type, state.frame, state.glass, state.design, state.handle, state.w, state.h, o].join('-');
}
function fromHash() {
  const m = location.hash.match(/cfg=([31sd])-([wkbc])-([cbsa])-([fvhg])-([blr])-(\d{3,4})-(\d{4})-([01]{3})/);
  if (!m) return false;
  const t = byId(TYPES, m[1]);
  Object.assign(state, {
    type: m[1], frame: m[2], glass: m[3], design: m[4], handle: m[5],
    w: clamp(Math.round(+m[6] / 10) * 10, W_ALL[0], W_ALL[1]), h: clamp(Math.round(+m[7] / 10) * 10, H_ALL[0], H_ALL[1]),
    o: { hanger: m[8][0] === '1' && t.slide, close: m[8][1] === '1', remove: m[8][2] === '1' }
  });
  return true;
}
fromHash();

// ---------- 견적 계산 (문 크기 기준) ----------
function computeLines() {
  const { t, dw, dh } = door();
  const f = byId(FRAMES, state.frame), g = byId(GLASSES, state.glass), d = byId(DESIGNS, state.design), hd = byId(HANDLES, state.handle);
  const stepsW = Math.max(0, Math.ceil((dw - BASE_W) / 100));
  const stepsH = Math.max(0, Math.ceil((dh - BASE_H) / 100));
  const area = dw * dh / 1e6;
  const lines = [];
  lines.push({ name: `기본 제품가, ${t.name}`, sub: `폭 ${BASE_W}mm, 높이 ${BASE_H}mm까지, 투명 강화유리`, price: t.base });
  const sizeParts = [];
  if (stepsW) sizeParts.push(`폭 100mm당 ${won(t.perW)}`);
  if (stepsH) sizeParts.push(`높이 100mm당 ${won(PER_H)}`);
  lines.push({ name: '치수 추가', sub: sizeParts.length ? sizeParts.join(', ') : '기본 치수 안', price: stepsW * t.perW + stepsH * PER_H });
  if (f.add) lines.push({ name: `프레임 ${f.name}`, sub: '아노다이징 색상 가산', price: f.add });
  lines.push({ name: `유리 ${g.name}`, sub: g.rate ? `유리 면적 기준, 투명 대비 가산` : '기본 사양', price: Math.round(g.rate * area / 1000) * 1000 });
  if (d.add) lines.push({ name: d.name, sub: d.sub, price: d.add });
  if (hd.add) lines.push({ name: hd.name, sub: hd.sub, price: hd.add });
  for (const x of EXTRAS) if (state.o[x.id] && !(x.id === 'hanger' && !t.slide)) {
    const n = x.id === 'close' ? t.leaves : 1;

        if (!c.started) { c.started = true; if (p.gm) { const bm = c.g1.bump ? aquaTex : null; if (p.gm.bumpMap !== bm) { p.gm.bumpMap = bm; p.gm.needsUpdate = true; } } }
        const t = Math.min(1, (now - c.t0) / 0.34), e = t * t * (3 - 2 * t);
        p.fm.color.copy(c.f0.c).lerp(c.f1.c, e); p.fm.metalness = c.f0.m + (c.f1.m - c.f0.m) * e; p.fm.roughness = c.f0.r + (c.f1.r - c.f0.r) * e;
        if (p.gm && c.g0) { p.gm.color.copy(c.g0.c).lerp(c.g1.c, e); p.gm.opacity = c.g0.o + (c.g1.o - c.g0.o) * e; p.gm.roughness = c.g0.r + (c.g1.r - c.g0.r) * e; }
        if (t >= 1) p.col = null;
      }
    }
    for (let i = dying.length - 1; i >= 0; i--) {
      const x = dying[i], o = x.d.panels;
      x.vy += dt * 40; o.position.y += x.vy * dt;
      if (o.position.y > 1.6) { disposeDoor(x.d); dying.splice(i, 1); }
    }

    // 카메라
    if (introCam) {
      const f = 1 - Math.exp(-dt * 1.6);
      v3.copy(camera.position).sub(controls.target).normalize().lerp(goalDir, f).normalize();
      camera.position.copy(controls.target).addScaledVector(v3, DIST);
      if (v3.distanceTo(goalDir) < 0.002) introCam = false;
    }
    const fk = reduce ? 1 : 1 - Math.exp(-dt * 4.2);
    focus.min.lerp(goal.min, fk); focus.max.lerp(goal.max, fk);
    _p.copy(focus.min).add(focus.max).multiplyScalar(0.5);
    v3.copy(_p).sub(controls.target);
    controls.target.add(v3); camera.position.add(v3);
    controls.update();
    camera.updateMatrixWorld();
    const cw = innerWidth, ch = innerHeight, aspect = cw / ch;
    let i = 0;
    for (const x of [focus.min.x, focus.max.x]) for (const y of [focus.min.y, focus.max.y]) for (const z of [focus.min.z, focus.max.z]) corners[i++].set(x, y, z).applyMatrix4(camera.matrixWorldInverse);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const c of corners) { x0 = Math.min(x0, c.x); x1 = Math.max(x1, c.x); y0 = Math.min(y0, c.y); y1 = Math.max(y1, c.y); }
    const Wd = wide();
    const mt = Wd ? 96 : 126, mb = Wd ? 130 : 100, ms = Wd ? 80 : 6;
    const S = Math.max((y1 - y0) * ch / (2 * (ch - mt - mb)), (x1 - x0) * ch / (2 * (cw - 2 * ms)));
    const yc = mt + (ch - mt - mb) / 2, ny = 1 - 2 * yc / ch;
    const cy = (y0 + y1) / 2 - ny * S, cx = (x0 + x1) / 2;
    if (!fr.init || reduce) { fr.S = S; fr.cx = cx; fr.cy = cy; fr.init = true; }
    else if (!ui.drag) { fr.S += (S - fr.S) * fk; fr.cx += (cx - fr.cx) * fk; fr.cy += (cy - fr.cy) * fk; }
    camera.left = fr.cx - fr.S * aspect; camera.right = fr.cx + fr.S * aspect;
    camera.top = fr.cy + fr.S; camera.bottom = fr.cy - fr.S;
    camera.updateProjectionMatrix();

    // 줄자 손잡이 자리 (줄자 끝에서 바깥으로 조금)
    const { W, H, DW, DH } = cur3;
    const sheetOpen = $('sheet').open;
    const kShow = !sheetOpen && !introCam;
    if (kShow) {
      const sw0 = toScreen(_a.set(W, 0.005, RZ)), sw1 = toScreen(_b.set(W + 0.3, 0.005, RZ));
      let dx = sw1.x - sw0.x, dy = sw1.y - sw0.y, l = Math.hypot(dx, dy) || 1;
      knobs.w.style.transform = `translate(${Math.round(sw0.x + dx / l * 26)}px, ${Math.round(sw0.y + dy / l * 26)}px)`;
      const sh0 = toScreen(_a.set((HX0 + HX1) / 2, H, T / 2)), sh1 = toScreen(_b.set((HX0 + HX1) / 2, H + 0.3, T / 2));
      dx = sh1.x - sh0.x; dy = sh1.y - sh0.y; l = Math.hypot(dx, dy) || 1;
      knobs.h.style.transform = `translate(${Math.round(sh0.x + dx / l * 26)}px, ${Math.round(sh0.y + dy / l * 26)}px)`;
      knobs.w.classList.toggle('over', W !== DW); knobs.h.classList.toggle('over', H !== DH);
      if (ui.drag && ui.drag.on) {
        const k = ui.drag.k, el = knobs[k], r = el.getBoundingClientRect();
        const over = k === 'w' ? W !== DW : H !== DH;
        kval.textContent = (k === 'w' ? '폭 ' : '높이 ') + mm(state[k]);
        kval.classList.toggle('over', over);
        kval.style.transform = `translate(${Math.round(clamp(r.left + 22 - kval.offsetWidth / 2, 8, cw - kval.offsetWidth - 8))}px, ${Math.round(r.top - kval.offsetHeight - 8)}px)`;
        kval.style.visibility = 'visible';
      } else kval.style.visibility = 'hidden';
    }
    if (kShow !== knobShown) { knobShown = kShow; knobs.w.style.visibility = knobs.h.style.visibility = kShow ? 'visible' : 'hidden'; if (!kShow) kval.style.visibility = 'hidden'; }

    // 문 위 도구
    const show = ui.sel && actEl.childElementCount > 0 && !ui.drag;
    if (show) {
      _p.set(DW / 2, Math.min(H, DH) * 0.62, 0.1).project(camera);
      const x = (_p.x + 1) / 2 * cw, y = (1 - _p.y) / 2 * ch;
      const aw = actEl.offsetWidth, ah = actEl.offsetHeight;
      const lx = clamp(x - aw / 2, 8, cw - aw - 8), ly = clamp(y - ah / 2, Wd ? 90 : 128, ch - ah - (Wd ? 130 : 100));
      actEl.style.transform = `translate(${Math.round(lx)}px, ${Math.round(ly)}px)`;
    }
    if (show !== actShown) { actShown = show; actEl.style.visibility = show ? 'visible' : 'hidden'; }

    renderer.render(scene, camera);
  });

  return { build, showMove: () => showMove(0.05), toggleDoor, axisPx };
}
</script>
