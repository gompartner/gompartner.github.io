<style>
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 90deg; }
  :root {
    --bg: #e4ece9;
    --surface: #ffffff;
    --ink: #1c2422;
    --ink-2: #44504c;
    --ink-3: #5f6b67;
    --line: #d6dfdb;
    --accent: #146b56;
    --accent-ink: #ffffff;
    --over: #c25a0c;
    --over-soft: #fff1e3;
    --focus: #1f5fbf;
    --shadow: 0 1px 2px rgba(20,40,34,.10), 0 6px 18px rgba(20,40,34,.10);
    --top: env(safe-area-inset-top, 0px);
    --bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
    font-size: 16px; line-height: 1.5; word-break: keep-all;

  }

  button { -webkit-tap-highlight-color: transparent; cursor: pointer; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }
  .nogl { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }

  /* 위: 상호, 메뉴, 견적 요청 */
  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    padding: calc(var(--top) + 10px) 16px 0; display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink); text-decoration: none; margin-right: auto; }
  .brand b { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }

  .ibtn {
    width: 44px; height: 44px; flex: none; display: inline-grid; place-items: center; padding: 0;
    background: var(--surface); border: 0; border-radius: 10px; color: var(--ink); box-shadow: var(--shadow);
  }
  .ibtn svg { width: 22px; height: 22px; }
  .cta {

  }
  .cta:active { transform: translateY(1px); }

  .menu {
    position: fixed; z-index: 8; top: calc(var(--top) + 60px); right: 16px; width: 220px;

  .menu a { display: flex; align-items: center; min-height: 48px; padding: 0 12px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 16px; }

  .menu a:hover { background: #f2f5f4; }
  .menu p { margin: 8px 12px 6px; font-size: 13px; color: var(--ink-3); }
  .menu .mcopy { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; padding: 0 12px; border: 0; border-top: 1px solid var(--line); margin-top: 4px; background: none; border-radius: 0 0 6px 6px; font-size: 16px; text-align: left; }
  .menu .mcopy svg { width: 20px; height: 20px; color: var(--ink-2); }
  .menu .mcopy:hover { background: #f2f5f4; }

  /* 폭과 금액 */
  .info {
    position: fixed; z-index: 4; left: 50%; top: calc(var(--top) + 64px); transform: translateX(-50%);
    display: flex; align-items: stretch; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums; max-width: calc(100vw - 32px);
  }
  .info button { border: 0; background: none; padding: 6px 14px; min-height: 52px; text-align: left; display: flex; align-items: center; gap: 8px; }
  .wbtn { border-radius: 12px 0 0 12px; }
  .wbtn svg { width: 22px; height: 22px; flex: none; color: var(--ink-2); }
  .wbtn span { display: grid; line-height: 1.25; }
  .wbtn b { font-size: 16px; white-space: nowrap; }
  .wbtn small { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .wbtn.over {
    background: repeating-linear-gradient(-45deg, var(--over-soft) 0 8px, #ffe2c4 8px 16px);
  }
  .wbtn.over small, .wbtn.over svg { color: var(--over); font-weight: 700; }
  .pbtn { border-left: 1px solid var(--line) !important; border-radius: 0 12px 12px 0; position: relative; }
  .pbtn b { font-size: 18px; white-space: nowrap; }
  .delta {
    position: absolute; right: 12px; top: 100%; margin-top: 6px; font-style: normal; font-size: 13px; font-weight: 700;
    background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
    visibility: hidden; transform: translateY(-4px); transition: transform .25s, visibility 0s .25s;
  }
  .delta.on { visibility: visible; transform: none; transition: transform .25s; }

  .wallpop {
    position: fixed; z-index: 6; left: 50%; top: calc(var(--top) + 124px); transform: translateX(-50%);
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; display: flex; align-items: center; gap: 6px;
  }
  .wallpop label { font-size: 14px; color: var(--ink-2); padding: 0 6px 0 4px; white-space: nowrap; }
  .wallpop input {
    width: 92px; height: 44px; border: 1px solid #c7d0cc; border-radius: 6px; text-align: center; font-size: 17px; font-weight: 700;
    font-variant-numeric: tabular-nums; -moz-appearance: textfield;
  }
  .wallpop input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .wallpop .ibtn { box-shadow: none; background: #eef3f1; }
  .wallpop em { font-style: normal; font-size: 14px; color: var(--ink-3); }

  /* 3D 위 모듈 도구 */
  .act {
    position: fixed; z-index: 3; left: 0; top: 0; display: flex; gap: 6px; padding: 6px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); visibility: hidden;
  }
  .act button { width: 44px; height: 44px; border: 0; border-radius: 8px; background: #eef3f1; display: grid; place-items: center; padding: 0; color: var(--ink); }
  .act button svg { width: 22px; height: 22px; }
  .act button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .act button[aria-disabled="true"] { opacity: .38; }
  .act .del { color: #9b2c13; }
  .act button.opt { width: auto; min-width: 58px; padding: 0 10px; font-size: 14px; font-weight: 600; white-space: nowrap; display: flex; gap: 6px; }
  .act button.opt svg { width: 20px !important; height: 20px !important; }
  .act .sep { width: 1px; align-self: stretch; margin: 6px 1px; background: var(--line); flex: none; }
  .act::after {
    content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px;
    background: var(--surface); transform: rotate(45deg); border-radius: 2px;
  }
  .hint {
    position: fixed; z-index: 3; left: 0; top: 0; width: 48px; height: 48px; margin: -8px 0 0 -16px; pointer-events: none;
    visibility: hidden; color: var(--ink);
  }
  .hint.on { visibility: visible; animation: hint-tap 1.1s ease-in-out 3; }
  .hint svg { width: 48px; height: 48px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
  @keyframes hint-tap { 0%, 100% { translate: 0 0; } 45% { translate: 0 8px; } }
  .dropmk {
    position: fixed; z-index: 3; left: 0; top: 0; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    border: 3px dashed var(--accent); background: rgba(255,255,255,.75); visibility: hidden; pointer-events: none;
  }
  .dropmk.near { background: var(--accent); border-style: solid; }

  /* 아래: 모듈 트레이 */
  .tray {
    position: fixed; z-index: 4; left: 16px; right: 16px; bottom: calc(var(--bot) + 12px);
    display: flex; align-items: center; gap: 6px; padding: 8px;
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
  }
  .tile {
    flex: 1 1 0; min-width: 0; height: 68px; border: 0; border-radius: 10px; background: #f0f4f2;
    display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; padding: 6px 0 6px;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .tile svg { width: 34px; height: 34px; color: var(--ink); }
  .tile span { font-size: 13px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
  .tile:active { background: #dde8e3; }
  .tile[aria-disabled="true"] { opacity: .4; }
  .tdiv { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--line); flex: none; }
  .swbtn {
    width: 56px; height: 56px; flex: none; border-radius: 50%; border: 3px solid #fff; padding: 0;
    box-shadow: 0 0 0 1px #c7d0cc, 0 2px 6px rgba(0,0,0,.18); position: relative;
  }
  .swbtn[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--ink), 0 2px 6px rgba(0,0,0,.18); }

  .ghost {
    position: fixed; z-index: 9; left: 0; top: 0; width: 64px; height: 64px; margin: -40px 0 0 -32px; border-radius: 12px;
    background: var(--surface); box-shadow: 0 8px 24px rgba(0,0,0,.22); display: grid; place-items: center; pointer-events: none;
  }
  .ghost svg { width: 40px; height: 40px; }

  /* 견본 부채 */
  .fan { position: fixed; z-index: 6; left: 0; top: 0; width: 0; height: 0; visibility: hidden; }
  .fan.on { visibility: visible; }
  .fan::before {
    content: ""; position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--surface); box-shadow: 0 0 0 1px #c7d0cc, 0 2px 6px rgba(0,0,0,.2); z-index: 20;
  }
  .blade {
    position: absolute; left: 0; top: -23px; width: 212px; height: 46px; transform-origin: 0 50%;
    transform: rotate(calc(var(--a) * -1)); pointer-events: none;
    transition: --a .46s cubic-bezier(.3, 1.45, .55, 1);
  }
  .chipc {
    position: absolute; left: 118px; right: 0; top: 0; bottom: 0; border-radius: 23px; border: 3px solid #fff; padding: 0;
    pointer-events: auto; box-shadow: 0 2px 8px rgba(0,0,0,.22); transition: transform .2s;
  }
  .blade::before {
    content: ""; position: absolute; left: 4px; width: 120px; top: 18px; height: 10px; border-radius: 5px;
    background: var(--c, #ddd); box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.2);
  }
  .chipc[aria-pressed="true"] { transform: translateX(12px); box-shadow: 0 0 0 2px var(--ink), 0 2px 8px rgba(0,0,0,.22); }
  .fanhead {
    position: fixed; z-index: 6; right: 16px; bottom: 0; display: grid; justify-items: end; gap: 6px; visibility: hidden;
  }
  .fanhead.on { visibility: visible; }
  .fanhead p {
    margin: 0; background: var(--ink); color: #fff; font-size: 14px; padding: 4px 10px; border-radius: 6px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .fabs { display: flex; gap: 6px; background: var(--surface); padding: 5px; border-radius: 12px; box-shadow: var(--shadow); }
  .fabs button { height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: none; font-size: 15px; white-space: nowrap; }
  .fabs button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }

  .toast {
    position: fixed; z-index: 7; left: 50%; bottom: calc(var(--bot) + 104px); transform: translate(-50%, 8px);
    background: var(--ink); color: #fff; border-radius: 10px; padding: 0 6px 0 16px; min-height: 48px;
    display: flex; align-items: center; gap: 6px; font-size: 15px; max-width: calc(100vw - 32px);
    visibility: hidden; transition: transform .2s, visibility 0s .2s;
  }
  .toast.on { visibility: visible; transform: translate(-50%, 0); transition: transform .2s; }
  .toast span { padding: 12px 10px 12px 0; }
  .toast button { min-height: 44px; border: 0; background: none; color: #9fe3cd; font-weight: 700; padding: 0 10px; white-space: nowrap; }

  /* 견적 시트 */
  dialog.sheet {
    border: 0; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 90dvh;
    border-radius: 16px 16px 0 0; background: var(--surface); color: var(--ink); overflow: hidden;
  }
  dialog.sheet[open] { animation: sheet-up .32s cubic-bezier(.2,.9,.3,1); }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  dialog.sheet::backdrop { background: rgba(16,28,24,.32); }
  .sheet-in { max-height: 90dvh; overflow-y: auto; padding: 8px 16px calc(var(--bot) + 16px); }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -8px; background: var(--surface); padding: 6px 0; z-index: 1; }
  .sheet-h h2 { font-size: 19px; margin: 0; }
  .sheet-h .ibtn { box-shadow: none; }
  .sum { display: grid; gap: 2px; padding: 12px 14px; background: #f0f4f2; border-radius: 10px; }
  .sum b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .sum p { margin: 0; font-size: 14px; color: var(--ink-2); }
  details.parts { margin-top: 8px; }
  details.parts summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-size: 15px; color: var(--ink-2); list-style: none; }
  details.parts summary::-webkit-details-marker { display: none; }
  details.parts summary::after { content: ""; width: 8px; height: 8px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg); margin: -4px 0 0 10px; }
  details.parts[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; white-space: nowrap; padding-left: 12px; }
  td small { display: block; color: var(--ink-3); font-size: 13px; }
  .h3 { font-size: 15px; margin: 18px 0 8px; font-weight: 700; }
  .seg { display: flex; gap: 6px; }
  .seg label { flex: 1; min-width: 0; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: grid; place-items: center; text-align: center; min-height: 52px; border-radius: 8px; border: 1px solid #c7d0cc; font-size: 14px; line-height: 1.25; padding: 4px; cursor: pointer;
  }
  .seg span small { font-size: 12px; color: var(--ink-3); }
  .seg input:checked + span { border: 2px solid var(--ink); font-weight: 700; }
  .seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  form .in { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); margin-top: 12px; }
  form input, form select {
    height: 48px; border: 1px solid #b9c4bf; border-radius: 6px; padding: 0 12px; font-size: 17px; color: var(--ink); background: #fff; width: 100%;
  }
  form [aria-invalid="true"] { border-color: #b3261e; border-width: 2px; }
  .err { color: #b3261e; font-size: 13px; min-height: 0; }
  .err:empty { display: none; }
  .send { width: 100%; height: 52px; margin-top: 18px; font-size: 17px; }
  .done { padding: 4px 0 4px; outline: none; }
  .done h3 { font-size: 19px; margin: 6px 0 12px; }
  .done dl { margin: 0; display: grid; grid-template-columns: 82px 1fr; gap: 8px 12px; font-size: 15px; }
  .done dt { color: var(--ink-3); }
  .done dd { margin: 0; }
  .line-btn { width: 100%; height: 48px; margin-top: 18px; border: 1px solid #b9c4bf; background: #fff; border-radius: 10px; font-size: 16px; }
  .foot { margin: 20px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); text-align: center; }

  @media (min-width: 900px) {
    .top { padding: 18px 24px 0; }
    .brand b { font-size: 24px; }
    .info { top: 20px; }
    .info button { min-height: 56px; padding: 6px 18px; }
    .wbtn b { font-size: 18px; } .pbtn b { font-size: 20px; }
    .wallpop { top: 86px; }
    .menu { top: 72px; right: 24px; }
    .tray { left: 50%; right: auto; transform: translateX(-50%); width: 620px; bottom: 24px; padding: 10px; gap: 8px; }
    .tile { height: 80px; }
    .tile svg { width: 40px; height: 40px; }
    .tile span { font-size: 14px; }
    .tile:hover { background: #e4ede9; }
    .swbtn { width: 64px; height: 64px; }
    .toast { bottom: 132px; }
    dialog.sheet { margin: 16px 16px 16px auto; width: 440px; max-height: calc(100dvh - 32px); border-radius: 16px; }
    dialog.sheet[open] { animation-name: sheet-in; }
    @keyframes sheet-in { from { transform: translateX(110%); } }
    .sheet-in { max-height: calc(100dvh - 32px); padding: 12px 24px 24px; }
  }
  @media (max-width: 370px) {
    .brand small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blade, .chipc, .delta, .toast { transition: none !important; }
    .hint.on { animation: none; }
    dialog.sheet[open] { animation: none; }
  }
  /* 11-04 다른 카탈로그 데모와 같은 맨 위 곰파트너 바로가기 줄(40px, 검정) */
  .gp-bar { height: 40px; background: #15171c; color: #fff; z-index: 40; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  .gp-bar > div { max-width: 1248px; height: 100%; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; }
  .gp-bar a { display: inline-flex; align-items: center; min-height: 40px; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
  .gp-bar a:hover { color: #8fb4ff; }
  .gp-bar a:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
  /* PC는 위치가 px로 따로 정해져 있어 바로가기 줄(40px)만큼 내린다 */
  @media (min-width: 900px) { .top { padding-top: 58px; } .info { top: 60px; } .wallpop { top: 126px; } .menu { top: 112px; } }
  @media (min-width: 768px) { .gp-bar > div { padding: 0 24px; } }
  .gp-bar { position: fixed; top: 0; left: 0; right: 0; }
  :root { --top: calc(env(safe-area-inset-top, 0px) + 40px) !important; }
</style>

<body>

<h1 class="sr">모듈 소파 구성하기</h1>
<canvas id="scene" aria-label="소파 3D 화면. 모듈을 누르면 빼거나 바꿀 수 있습니다." tabindex="-1"></canvas>
<div class="nogl" id="nogl">이 브라우저에서는 3D 화면을 열 수 없습니다. 아래 모듈 버튼으로 구성하고 견적을 요청할 수 있습니다.</div>

<div class="top">
  <a class="brand" href="./"><b>가구 쇼룸</b><small>곰파트너 카탈로그</small></a>
  <button class="ibtn" type="button" id="menu-btn" aria-label="메뉴" aria-expanded="false" aria-controls="menu">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const wide = () => innerWidth >= 900;

// ---------- 상품 정보와 단가 (부가세 포함, 생활방수 패브릭 기준) ----------
const MOD = {
  S: { name: '1인 모듈', short: '1인', w: 0.82, dp: 0.95, price: 520000, sub: '폭 820mm, 깊이 950mm' },
  C: { name: '코너 모듈', short: '코너', w: 0.95, dp: 0.95, price: 690000, sub: '폭 950mm, 깊이 950mm' },
  L: { name: '카우치 모듈', short: '카우치', w: 0.82, dp: 1.6, price: 860000, sub: '폭 820mm, 깊이 1,600mm' }
};
const ARM_W = 0.16, ARM_PRICE = 150000, ARM_LONG_PRICE = 190000;
const STOOL_W = 0.8, STOOL_PRICE = 290000, MAX_STOOL = 2;
const MAXM = 8;
const FABS = [
  { id: 'w', name: '생활방수 패브릭', short: '패브릭', rate: 0, colors: [
    ['오트밀', '#c9bba4'], ['라이트 그레이', '#aeaca6'], ['웜 베이지', '#b9a084'], ['세이지 그린', '#8d9a80'], ['딥 네이비', '#3e4757'], ['차콜', '#4b4946']] },
  { id: 'b', name: '부클레', short: '부클레', rate: 12, colors: [
    ['아이보리', '#ddd6c7'], ['크림 베이지', '#cfbfa4'], ['그레이지', '#b3aa9d'], ['모카', '#8a725d']] },
  { id: 'l', name: '천연 가죽', short: '가죽', rate: 38, colors: [
    ['크림 아이보리', '#d6c6ab'], ['카멜', '#9a6a40'], ['코냑', '#6c3a22'], ['다크 그레이', '#4b4947'], ['블랙', '#272625']] }
];
const LEGS = [
  { id: 'o', name: '오크 원목', sub: '높이 110mm', price: 24000 },
  { id: 'k', name: '블랙 메탈', sub: '높이 110mm', price: 32000 },
  { id: 'n', name: '로우형', sub: '다리 없음', price: 0 }
];
const CUSHS = [
  { id: 's', name: '소프트', price: 35000 }, { id: 'm', name: '미디엄', price: 0 }, { id: 'h', name: '하드', price: 0 }
];
const ARMS = [{ v: 'b', t: '양쪽' }, { v: 'l', t: '왼쪽' }, { v: 'r', t: '오른쪽' }, { v: 'n', t: '없음' }];
const REGIONS = ['서울', '경기', '인천', '강원', '대전, 세종, 충청', '광주, 전라', '대구, 경북', '부산, 울산, 경남', '제주'];
const TILE = { S: ['S'], D: ['S', 'S'], L: ['L'], C: ['C'] };
const TILE_NAME = { S: '1인 모듈', D: '1인 모듈 2개', L: '카우치 모듈', C: '코너 모듈', T: '스툴' };

let nid = 1;
const mk = s => s.split('').map(t => ({ t, id: nid++ }));
const state = { mods: mk('SSS'), arms: 'b', fab: 'w', col: 0, leg: 'o', cush: 'm', stools: 0, wall: 3600, sel: -1 };
const ui = { stoolSel: -1, armSel: 0, sub: null, fan: false, sent: false };
const won = n => n.toLocaleString('ko-KR') + '원';
const mm = n => n.toLocaleString('ko-KR') + 'mm';
const fabOf = () => FABS.find(f => f.id === state.fab);
const legOf = () => LEGS.find(l => l.id === state.leg);
const cushOf = () => CUSHS.find(c => c.id === state.cush);
const types = () => state.mods.map(m => m.t).join('');
const cnt = (ts, t) => [...ts].filter(x => x === t).length;

// 붙일 수 있는 구성인지: 코너 2개까지(이어 붙이기 안 됨), 카우치는 1개, 끝자리만, 코너와 함께 쓰지 않음
function valid(ts) {
  if (ts.length < 1 || ts.length > MAXM) return false;
  const nc = cnt(ts, 'C'), nl = cnt(ts, 'L');
  if (nc > 2 || nl > 1 || (nl && nc)) return false;
  if (nl && ts.length < 2) return false;
  if (nl && ts[0] !== 'L' && ts[ts.length - 1] !== 'L') return false;
  if (ts.includes('CC')) return false;
  if (!/[SL]/.test(ts)) return false;
  return true;
}
function why(nt) {
  if (valid(nt)) return '';
  const nc = cnt(nt, 'C'), nl = cnt(nt, 'L');
  if (nt.length > MAXM) return `모듈은 ${MAXM}개까지 붙일 수 있습니다`;
  if (nl > 1) return '카우치는 1개까지 넣을 수 있습니다';
  if (nl && nc) return '카우치와 코너는 함께 쓸 수 없습니다';
  if (nc > 2) return '코너는 2개까지 넣을 수 있습니다';
  if (nt.includes('CC')) return '코너끼리는 붙일 수 없습니다';
  if (nl) return '카우치는 양 끝에만 붙일 수 있습니다';
  return '이 자리에는 붙일 수 없습니다';
}
const addTs = (end, add) => end === 'l' ? add + types() : types() + add;
function endsFor(tile) {
  const add = TILE[tile].join('');
  return ['r', 'l'].filter(e => valid(addTs(e, add)));
}
function removeWhy(i) {
  const ts = types(), rest = ts.slice(0, i) + ts.slice(i + 1);
  if (valid(rest)) return '';
  if (!rest.length) return '마지막 모듈이라 뺄 수 없습니다';
  if (rest.includes('CC')) return '빼면 코너끼리 붙어서 뺄 수 없습니다';
  if (rest.includes('L') && rest[0] !== 'L' && rest[rest.length - 1] !== 'L') return '빼면 카우치가 가운데로 와서 뺄 수 없습니다';
  return '빼면 혼자 쓸 수 없는 모듈만 남아서 뺄 수 없습니다';
}

// ---------- 배치 계산: 모듈을 순서대로 놓고, 코너에서 앞쪽으로 꺾습니다 ----------
function layoutOf(ts, arms) {
  const F = d => ({ x: -d.z, z: d.x });
  let p = { x: 0, z: 0 }, d = { x: 1, z: 0 };
  const items = [], segs = [{ n: 0, d: { ...d }, idx: [] }];
  [...ts].forEach((t, i) => {
    const f = F(d), m = MOD[t];
    if (t === 'C') {
      items.push({ kind: 'mod', i, t, x: p.x + d.x * 0.475 + f.x * 0.475, z: p.z + d.z * 0.475 + f.z * 0.475, d: { ...d }, w: 0.95, dp: 0.95, seg: segs.length - 1 });
      p = { x: p.x + d.x * 0.95 + f.x * 0.95, z: p.z + d.z * 0.95 + f.z * 0.95 };
      d = f; segs.push({ n: 0, d: { ...d }, idx: [] });
    } else {
      const s = segs[segs.length - 1];
      items.push({ kind: 'mod', i, t, x: p.x + d.x * m.w / 2 + f.x * m.dp / 2, z: p.z + d.z * m.w / 2 + f.z * m.dp / 2, d: { ...d }, w: m.w, dp: m.dp, seg: segs.length - 1 });
      s.n++; s.idx.push(i);
      p = { x: p.x + d.x * m.w, z: p.z + d.z * m.w };
    }
  });
  const d0 = { x: 1, z: 0 }, f0 = F(d0), fe = F(d);
  const dp0 = MOD[ts[0]].dp, dpE = ts[ts.length - 1] === 'C' ? 0.95 : MOD[ts[ts.length - 1]].dp;
  const aL = arms === 'b' || arms === 'l', aR = arms === 'b' || arms === 'r';
  if (aL) items.push({ kind: 'arm', side: -1, x: -ARM_W / 2, z: dp0 / 2, d: d0, w: ARM_W, dp: dp0 });
  if (aR) items.push({ kind: 'arm', side: 1, x: p.x + d.x * ARM_W / 2 + fe.x * dpE / 2, z: p.z + d.z * ARM_W / 2 + fe.z * dpE / 2, d: { ...d }, w: ARM_W, dp: dpE });
  const gapL = (aL ? ARM_W : 0) + 0.45, gapR = (aR ? ARM_W : 0) + 0.45;
  const slots = [
    { end: 'l', x: -gapL * d0.x + f0.x * dp0 * 0.5, z: -gapL * d0.z + f0.z * dp0 * 0.5 },
    { end: 'r', x: p.x + d.x * gapR + fe.x * dpE * 0.5, z: p.z + d.z * gapR + fe.z * dpE * 0.5 }
  ];
  let main = 0;
  segs.forEach((s, k) => { if (s.n > segs[main].n || (s.n === segs[main].n && segs.length === 3 && k === 1)) main = k; });
  const mf = F(segs[main].d);
  let q = 0, v = { ...mf };
  while (!(Math.abs(v.x) < 1e-6 && v.z > 0) && q < 4) { v = { x: -v.z, z: v.x }; q++; }
  const rot = o => { for (let k = 0; k < q; k++) { const t = o.x; o.x = -o.z; o.z = t; } return o; };
  for (const it of items) { rot(it); rot(it.d); it.f = F(it.d); it.ry = Math.atan2(-it.d.z, it.d.x); }
  slots.forEach(rot);
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const it of items) {
    const hx = Math.abs(it.d.x) * it.w / 2 + Math.abs(it.f.x) * it.dp / 2;
    const hz = Math.abs(it.d.z) * it.w / 2 + Math.abs(it.f.z) * it.dp / 2;
    it.hx = hx; it.hz = hz;
    minX = Math.min(minX, it.x - hx); maxX = Math.max(maxX, it.x + hx);
    minZ = Math.min(minZ, it.z - hz); maxZ = Math.max(maxZ, it.z + hz);
  }
  const ox = -(minX + maxX) / 2, oz = -minZ;
  for (const it of items) { it.x += ox; it.z += oz; }
  for (const s of slots) { s.x += ox; s.z += oz; }
  const W = maxX - minX, D = maxZ - minZ;
  const mainMods = items.filter(it => it.kind === 'mod' && it.seg === main && it.t === 'S');
  const ref = mainMods.length ? mainMods : items.filter(it => it.kind === 'mod' && it.t !== 'L');
  let sx0 = Infinity, sx1 = -Infinity;
  for (const it of ref) { sx0 = Math.min(sx0, it.x - it.hx); sx1 = Math.max(sx1, it.x + it.hx); }
  return { items, slots, W, D, mainX: (sx0 + sx1) / 2, mainW: sx1 - sx0, frontZ: 0.95 };
}

// ---------- 해시 저장과 복원 ----------
function toHash() {
  return 'cfg=' + [types(), state.arms, state.fab + state.col, state.leg, state.cush, state.stools, state.wall].join('-');
}
function fromHash() {
  const m = location.hash.match(/cfg=([SCL]{1,8})-([blrn])-([wbl])(\d)-([okn])-([smh])-([0-2])(?:-(\d{4}))?/);
  if (!m || !valid(m[1])) return false;
  const fab = FABS.find(f => f.id === m[3]);
  if (+m[4] >= fab.colors.length) return false;
  if (types() !== m[1]) state.mods = mk(m[1]);
  const wall = m[8] ? Math.min(9000, Math.max(1500, +m[8])) : 3600;
  Object.assign(state, { arms: m[2], fab: m[3], col: +m[4], leg: m[5], cush: m[6], stools: +m[7], wall, sel: -1 });
  return true;
}
fromHash();

// ---------- 견적 계산 ----------
function computeParts() {
  const ts = types();
  const L = layoutOf(ts, state.arms);
  const f = fabOf(), leg = legOf(), cu = cushOf();
  const list = [];
  for (const t of ['S', 'C', 'L']) {
    const n = cnt(ts, t);
    if (n) list.push({ name: MOD[t].name, sub: MOD[t].sub, qty: n, unit: MOD[t].price });
  }
  const arms = L.items.filter(it => it.kind === 'arm');
  const longA = arms.filter(a => a.dp > 1).length, shortA = arms.length - longA;
  if (shortA) list.push({ name: '암 레스트', sub: '폭 160mm, 깊이 950mm', qty: shortA, unit: ARM_PRICE });
  if (longA) list.push({ name: '암 레스트 카우치용', sub: '폭 160mm, 깊이 1,600mm', qty: longA, unit: ARM_LONG_PRICE });
  if (state.stools) list.push({ name: '스툴', sub: '폭 800mm, 깊이 800mm', qty: state.stools, unit: STOOL_PRICE });
  const base = list.reduce((s, p) => s + p.qty * p.unit, 0);
  if (f.rate) list.push({ name: '원단 추가금', sub: `${f.name}, 본체 금액의 ${f.rate}%`, qty: 1, unit: Math.round(base * f.rate / 100 / 1000) * 1000 });

// 합계: 숫자가 짧게 굴러가며 바뀌고, 변동액이 잠깐 보입니다
let totTarget = null, totShown = 0, totRaf = 0;
function setTotal(v) {
  const el = $('total');
  if (totTarget === null) { totTarget = totShown = v; el.textContent = won(v); return; }
  if (v === totTarget) return;
  const d = v - totTarget;
  totTarget = v;
  const de = $('delta');
  de.textContent = (d > 0 ? '+' : '-') + won(Math.abs(d));
  de.classList.add('on');
  clearTimeout(de._t); de._t = setTimeout(() => de.classList.remove('on'), 1500);
  cancelAnimationFrame(totRaf);
  if (reduce) { totShown = v; el.textContent = won(v); return; }
  const from = totShown, t0 = performance.now(), dur = 450;
  const tick = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - (1 - k) ** 3;
    totShown = k < 1 ? Math.round((from + (v - from) * e) / 1000) * 1000 : v;
    el.textContent = won(totShown);
    if (k < 1) totRaf = requestAnimationFrame(tick);
  };
  totRaf = requestAnimationFrame(tick);
}

function swatchBg(fid, hex) {
  if (fid === 'b') return `radial-gradient(circle at 50% 50%, rgba(255,255,255,.34) 1.4px, transparent 2.4px) 0 0 / 7px 7px, radial-gradient(circle at 50% 50%, rgba(0,0,0,.10) 1.4px, transparent 2.4px) 3.5px 3.5px / 7px 7px, ${hex}`;
  if (fid === 'l') return `linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,0) 45%, rgba(0,0,0,.18)), ${hex}`;
  return `repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 2px, transparent 2px 4px), repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, transparent 2px 4px), ${hex}`;
}

  undoFn = undo || null;
  toastU.hidden = !undo;

// ---------- 모듈 붙이기, 빼기, 바꾸기 ----------
function deselect() { state.sel = -1; ui.stoolSel = -1; ui.armSel = 0; ui.sub = null; }

    if (state.stools >= MAX_STOOL) { toast(`스툴은 ${MAX_STOOL}개까지 놓을 수 있습니다`); return; }
    state.stools++; deselect(); update({ drop: true });

  }
  const ends = endsFor(t);
  if (!ends.length) { toast(why(addTs('r', TILE[t].join('')))); return; }
  const end = endPref && ends.includes(endPref) ? endPref : ends[0];

  const prev = state.mods.slice();
  const name = MOD[state.mods[i].t].name;
  state.mods.splice(i, 1);

  toast(`${name}을 뺐습니다`, () => { state.mods = prev; deselect(); update({ drop: true }); });
}

  else if (b.dataset.cush) { if (state.cush !== b.dataset.cush) { state.cush = b.dataset.cush; update(); } }

      const pad = 1.5;
      goal.min.set(sel.x - sel.hx - pad, 0, sel.z - sel.hz - pad * 0.6);
      goal.max.set(sel.x + sel.hx + pad, 0.9, sel.z + sel.hz + pad * 0.6);
    } else {
      goal.min.set(-span / 2 - 0.05, 0, WALL_Z - WALL_T);
      goal.max.set(span / 2 + 0.05, WALL_H * 0.8, rulerTZ + RULER_D / 2);
    }
    if (sel && !PHONE) { mustGoal.min.copy(goal.min); mustGoal.max.copy(goal.max); mustGoal.min.x += 0.9; mustGoal.max.x -= 0.9; }
    else {
      mustGoal.min.set(-span / 2 - 0.02, 0, 0);
      mustGoal.max.set(span / 2 + 0.02, 0.78, rulerTZ + RULER_D / 2);
    }
    if (first) {
      focus.min.copy(goal.min).multiplyScalar(1.7); focus.max.copy(goal.max).multiplyScalar(1.7);
      must.min.copy(mustGoal.min).multiplyScalar(1.7); must.max.copy(mustGoal.max).multiplyScalar(1.7);
      if (reduce) { focus.min.copy(goal.min); focus.max.copy(goal.max); must.min.copy(mustGoal.min); must.max.copy(mustGoal.max); }
    }
    sun.shadow.camera.left = -span / 2 - 1.6; sun.shadow.camera.right = span / 2 + 1.6;
    sun.shadow.camera.top = 3.2; sun.shadow.camera.bottom = -3.2;
    sun.shadow.camera.updateProjectionMatrix();
    first = false;
  }
  function swapMat(p) {
    const nm = UPH[state.fab].clone(); nm.color.copy(p.mat.color);
    p.obj.traverse(o => { if (o.userData.uph) o.material = nm; });
    p.mat.dispose(); p.mat = nm; p.fab = state.fab;
  }

  // 처음 카메라 방향
  const startDir = dirOf(reduce ? DEF_AZ : DEF_AZ - 0.55, reduce ? DEF_POLAR : DEF_POLAR - 0.25);
  controls.target.set(0, 0.3, 1);
  camera.position.copy(controls.target).addScaledVector(startDir, DIST);
  let introCam = !reduce, userMoved = false;
  const goalDir = dirOf(DEF_AZ, DEF_POLAR);

  // 누르기와 돌리기 구분
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  function pick(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    // 실제 부품 모양을 먼저 보고, 틈을 누르면 바닥 상자로 찾습니다
    for (const h of ray.intersectObjects(root.children, true)) {
      let o = h.object;
      while (o && !o.userData.hit && o.parent !== root) o = o.parent;
      const data = o && o.userData.hit;
      if (!data) continue;
      // 다리나 받침을 누르면 바로 다리 고르기를 엽니다
      const m = h.object.material, low = m === oakMat || m === metalMat || m === plinthMat;
      return { ...data, low };
    }
    const hit = ray.intersectObjects(hits, false)[0];
    return hit ? { ...hit.object.userData, low: hit.point.y < 0.1 } : null;
  }
  canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
  controls.addEventListener('start', () => { introCam = false; });
  canvas.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    down = null;
    if (moved > 6) { userMoved = true; return; }
    selectAt(pick(e));
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || e.buttons) return;
    canvas.style.cursor = pick(e) ? 'pointer' : 'grab';
  });

  function size() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
  }
  addEventListener('resize', size); size();

  const v3 = new THREE.Vector3(), corners = Array.from({ length: 8 }, () => new THREE.Vector3());
  const _p = new THREE.Vector3();
  const actEl = $('act'), dropEls = { l: $('drop-l'), r: $('drop-r') };
  const clock = new THREE.Clock();
  let actShown = false;
  const hint = { el: $('hint'), state: 0, t0: performance.now() / 1000 + 1.9 };
  addEventListener('pointerdown', () => { if (hint.state < 2) { hint.state = 2; hint.el.classList.remove('on'); } }, { capture: true });
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.04);
    now = performance.now() / 1000;
    const k = reduce ? 1 : 1 - Math.exp(-dt * 6);

    // 부품 움직임
    for (const [key, p] of parts) {
      const o = p.obj;
      if (p.dying) {
        // 집어 올리듯 위로 빠집니다
        p.vy = (p.vy || 1.2) + dt * 9;
        o.position.y += p.vy * dt;
        o.scale.multiplyScalar(1 - dt * 1.4);
        if (o.position.y > 2.6 || reduce) { root.remove(o); p.mat.dispose(); parts.delete(key); }
        continue;
      }
      if (p.drop) {
        if (now < p.drop.t0) { o.visible = false; continue; }
        o.visible = true;
        p.drop.vy -= 17 * dt; p.drop.y += p.drop.vy * dt;
        if (p.drop.y <= 0) {
          if (!p.drop.b) {
            p.drop.b = 1; p.drop.y = 0; p.drop.vy = -p.drop.vy * 0.17;
            p.sqv -= 2.6;
            for (const q of parts.values()) if (q !== p && !q.drop && !q.dying) q.sqv -= 0.7;
          } else { p.drop = null; p.sqv -= 0.8; }
        }
        o.position.x = p.tp.x; o.position.z = p.tp.z; o.rotation.y = p.tr;
        if (p.drop) o.position.y = p.drop.y; else o.position.y = 0;
        p.vel.set(0, 0, 0);
      } else if (reduce) {
        o.position.copy(p.tp).setY(p.lift); o.rotation.y = p.tr;
      } else {
        // 옆으로 밀릴 때는 스프링으로 착 붙습니다
        v3.copy(p.tp).sub(o.position); v3.y = 0;
        p.vel.addScaledVector(v3, 190 * dt).multiplyScalar(Math.exp(-dt * 15));
        o.position.x += p.vel.x * dt; o.position.z += p.vel.z * dt;
        p.ly += (p.lift - p.ly) * (1 - Math.exp(-dt * 14));
        o.position.y = p.ly;
        o.rotation.y += (p.tr - o.rotation.y) * (1 - Math.exp(-dt * 10));
      }
      // 쿠션 눌림
      if (!reduce) {
        p.sqv += (-420 * p.sq - 13 * p.sqv) * dt;
        p.sq += p.sqv * dt;
        p.sq = Math.max(-0.16, Math.min(0.12, p.sq));
      } else p.sq = 0;
      o.scale.set(1 - p.sq * 0.35, 1 + p.sq, 1 - p.sq * 0.35);
      if (Math.abs(p.sq) > 1e-4 || p.sqSeat) {
        p.sqSeat = Math.abs(p.sq) > 1e-4;
        o.traverse(m => { if (m.userData.seat) m.scale.y = 1 + p.sq * 1.6; });
      }
      // 색 물결
      if (p.col && now >= p.col.t0) {
        if (!p.col.started) { p.col.started = true; if (p.fab !== p.col.fab) swapMat(p); p.col.from.copy(p.mat.color); if (!reduce) p.sqv -= 1.3; }
        const t = Math.min(1, (now - p.col.t0) / 0.32);
        p.mat.color.copy(p.col.from).lerp(p.col.to, t * t * (3 - 2 * t));
        if (t >= 1) p.col = null;
      }
    }

    // 방 크기 따라가기
    room.fw += (room.tfw - room.fw) * k; room.fd += (room.tfd - room.fd) * k; room.fz += (room.tfz - room.fz) * k; room.wall += (room.twall - room.wall) * k;
    rulerZ += (rulerTZ - rulerZ) * k;
    floorTop.scale.set(room.fw, room.fd, 1); floorTop.position.set(0, 0, room.fz);
    floorTex.repeat.set(room.fw / 1.8, room.fd / 1.8);
    slab.scale.set(room.fw, 0.16, room.fd); slab.position.set(0, -0.0805, room.fz);
    wall.scale.set(room.wall, WALL_H, WALL_T); wall.position.set(0, WALL_H / 2, WALL_Z - WALL_T / 2);
    base.scale.x = room.wall; base.position.set(0, 0.035, WALL_Z + 0.007);
    ruler.position.set(0, 0.02, rulerZ);
    rug.position.lerp(rugTP, k); rug.scale.lerp(rugTS, k); plant.position.lerp(plantTP, k);
    ring.position.lerp(ringTP, k); ring.scale.lerp(ringTS, k);

    // 카메라
    if (introCam) {
      const f = 1 - Math.exp(-dt * 1.6);
      v3.copy(camera.position).sub(controls.target).normalize().lerp(goalDir, f).normalize();
      camera.position.copy(controls.target).addScaledVector(v3, DIST);
      if (v3.distanceTo(goalDir) < 0.002) introCam = false;
    }
    const fk = reduce ? 1 : 1 - Math.exp(-dt * 4.2);
    focus.min.lerp(goal.min, fk); focus.max.lerp(goal.max, fk);
    must.min.lerp(mustGoal.min, fk); must.max.lerp(mustGoal.max, fk);
    _p.copy(focus.min).add(focus.max).multiplyScalar(0.5);
    v3.copy(_p).sub(controls.target);
    controls.target.add(v3); camera.position.add(v3);
    controls.update();
    camera.updateMatrixWorld();
    const cw = innerWidth, ch = innerHeight, aspect = cw / ch;
    const ext = b => {
      let i = 0;
      for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) corners[i++].set(x, y, z).applyMatrix4(camera.matrixWorldInverse);
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const c of corners) { x0 = Math.min(x0, c.x); x1 = Math.max(x1, c.x); y0 = Math.min(y0, c.y); y1 = Math.max(y1, c.y); }
      return [x0, x1, y0, y1];
    };
    let [x0, x1, y0, y1] = ext(focus);
    const W = wide(), tall = !W && ch > cw * 1.25;
    const trayTop = tray.getBoundingClientRect().top;
    const mt = W ? 100 : 128, mb = W ? 140 : Math.max(96, ch - trayTop + 8), ms = W ? 80 : 12;
    let S = Math.max((y1 - y0) * ch / (2 * (ch - mt - mb)), (x1 - x0) * ch / (2 * (cw - 2 * ms)));
    if (tall) {
      // 판이 화면 높이를 채우도록: 방은 높이로 맞추고, 소파와 줄자만 폭 안에 들어오면 됩니다
      const [mx0, mx1] = ext(must);
      S = Math.max((y1 - y0) * ch / (2 * (ch - mt - mb)), (mx1 - mx0) * ch / (2 * (cw - 2 * ms)));
      const half = S * cw / ch - ms * 2 * S / ch, c = Math.min(mx0 + half, Math.max(mx1 - half, (x0 + x1) / 2));
      x0 = c - 1; x1 = c + 1;
    }
    const yc = mt + (ch - mt - mb) / 2, ny = 1 - 2 * yc / ch;
    const cy = (y0 + y1) / 2 - ny * S, cx = (x0 + x1) / 2;
    if (!fr.init || reduce) { fr.S = S; fr.cx = cx; fr.cy = cy; fr.init = true; }
    else { fr.S += (S - fr.S) * fk; fr.cx += (cx - fr.cx) * fk; fr.cy += (cy - fr.cy) * fk; }
    camera.left = fr.cx - fr.S * aspect; camera.right = fr.cx + fr.S * aspect;
    camera.top = fr.cy + fr.S; camera.bottom = fr.cy - fr.S;
    camera.updateProjectionMatrix();

    sun.target.position.set(0, 0, room.fz); sun.position.copy(sun.target.position).add(SUN_OFF);

    // 고른 모듈 위 도구
    let show = !!actPart && !actPart.dying && actEl.childElementCount > 0;
    if (show) {
      // 고른 부품의 화면 윗끝 바로 위에 띄웁니다
      const b = actPart.box, ox = actPart.obj.position.x - b.x, oz = actPart.obj.position.z - b.z, top = (b.top || 0.8) + actPart.obj.position.y;
      let x = 0, y = Infinity;
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        _p.set(b.x + ox + sx * b.hx, top, b.z + oz + sz * b.hz).project(camera);
        x += (_p.x + 1) / 8 * cw; y = Math.min(y, (1 - _p.y) / 2 * ch);
      }
      const aw = actEl.offsetWidth, ah = actEl.offsetHeight;
      const lx = Math.max(8, Math.min(cw - aw - 8, x - aw / 2)), ly = Math.max(W ? 90 : 128, y - ah - 14);
      actEl.style.transform = `translate(${Math.round(lx)}px, ${Math.round(ly)}px)`;
    }
    if (show !== actShown) { actShown = show; actEl.style.visibility = show ? 'visible' : 'hidden'; }

    // 처음 한 번: 가운데 모듈 위에 누르는 손 아이콘을 잠깐 띄웁니다
    if (hint.state === 0 && now > hint.t0) {
      const mid = lastL && lastL.items.filter(it => it.kind === 'mod')[Math.floor(state.mods.length / 2)];
      if (mid && !anySel()) { hint.state = 1; hint.el.classList.add('on'); hint.mid = mid; hint.t1 = now + 3.4; } else hint.state = 2;
    }
    if (hint.state === 1) {
      _p.set(hint.mid.x, 0.5, hint.mid.z).project(camera);
      hint.el.style.transform = `translate(${Math.round((_p.x + 1) / 2 * cw)}px, ${Math.round((1 - _p.y) / 2 * ch)}px)`;
      if (now > hint.t1 || anySel() || ui.fan) { hint.state = 2; hint.el.classList.remove('on'); }
    }

    // 끌어다 놓을 자리
    if (drag && drag.on && lastL && drag.t !== 'T') {
      const ends = endsFor(drag.t);
      let best = null, bd = Infinity;
      for (const sl of lastL.slots) {
        const el = dropEls[sl.end];
        if (!ends.includes(sl.end)) { el.style.visibility = 'hidden'; continue; }
        _p.set(sl.x, 0.42, sl.z).project(camera);
        const x = (_p.x + 1) / 2 * cw, y = (1 - _p.y) / 2 * ch;
        el.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
        el.style.visibility = 'visible';
        const d = Math.hypot(x - (drag.cx || 0), y - (drag.cy || 0));
        if (d < bd) { bd = d; best = sl.end; }
      }
      drag.near = best;
      for (const e of ['l', 'r']) dropEls[e].classList.toggle('near', e === best);
    }

    renderer.render(scene, camera);
  });

  return { build };
}
</script>
</body>
