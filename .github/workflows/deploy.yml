name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 티스토리 예약 글(09시·18시 공개)이 사례 화면 블로그 링크에 들어가도록 하루 두 번 다시 빌드한다(UTC).
  schedule:
    - cron: "15 0 * * *"
    - cron: "15 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 구글 폰트 내려받기가 가끔 끊겨 빌드가 실패한다. 세 번까지 다시 시도한다.
      - run: |
          for i in 1 2 3; do
            npm run build && exit 0
            echo "빌드 실패, 30초 뒤 다시 시도 ($i/3)"
            sleep 30
          done
          exit 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
