name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 하루 두 번 다시 빌드한다(UTC). 09:15 빌드에서 그날 공개일인 가이드(data/guides.ts published)가 올라간다.
  schedule:
    - cron: "15 0 * * *"
    - cron: "15 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 구글 폰트 내려받기가 가끔 끊겨 빌드가 실패한다. 세 번까지 다시 시도한다.
      - run: |
          for i in 1 2 3; do
            npm run build && exit 0
            echo "빌드 실패, 30초 뒤 다시 시도 ($i/3)"
            sleep 30
          done
          exit 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 오늘 공개일인 가이드가 있으면 배포 뒤 IndexNow로 알린다.
  notify:
    needs: deploy
    if: github.event.schedule == '15 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: |
          today=$(TZ=Asia/Seoul date +%F)
          if grep -q "published: \"$today\"" data/guides.ts; then
            sleep 60
            node scripts/indexnow.mjs
          else
            echo "오늘 공개할 가이드 없음 ($today)"
          fi
