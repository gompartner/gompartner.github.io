<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0}body{width:390px;height:736px;font-family:Pretendard;background:#f4f6f9;color:#15171c;padding:22px 16px}
.h{font-size:22px;font-weight:800;letter-spacing:-.04em}.sub{color:#5b6370;font-size:14px;margin-top:4px}
.badge{display:inline-block;margin-top:12px;background:#e8f6ee;color:#147a45;font-weight:800;padding:6px 12px;border-radius:6px;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.s{background:#fff;border:1px solid #e1e5eb;border-radius:8px;padding:14px}.s b{display:block;font-size:22px}.s span{color:#5b6370;font-size:13px}
.card{background:#fff;border:1px solid #e1e5eb;border-radius:8px;padding:14px;margin-top:12px}.card h3{font-size:16px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;border-top:1px solid #eef1f5;padding:10px 0;font-size:14px}.ok{color:#147a45;font-weight:800}.warn{color:#b45309;font-weight:800}
</style></head><body><div class="h">월간 점검 보고</div><div class="sub">2026년 10월</div><div class="badge">정상 운영</div>
<div class="stats"><div class="s"><b>12건</b><span>이번 달 수정</span></div><div class="s"><b>D-28</b><span>SSL 만료</span></div></div>
<div class="card"><h3>정기 점검</h3><div class="row"><span>도메인 만료일</span><span class="ok">정상</span></div><div class="row"><span>SSL 인증서</span><span class="warn">갱신 예정</span></div><div class="row"><span>전체 백업</span><span class="ok">완료</span></div><div class="row"><span>보안 업데이트</span><span class="ok">적용</span></div><div class="row"><span>문의 폼 메일</span><span class="ok">정상</span></div></div>
</body></html>
